<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>智選小達人 - 真實相片選辦訓練</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #18181C;
      --card-border: #FFFF00;
      --text-color: #FFFF00;
      --subtext-color: #FFFFFF;
      --accent-color: #00FF00;
      --panel-bg: #161618;
      --border-color: #444444;
    }

    body.light-theme {
      --bg-color: #F4F6F9;
      --card-bg: #FFFFFF;
      --card-border: #002868;
      --text-color: #002868;
      --subtext-color: #111111;
      --accent-color: #008A00;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Microsoft JhengHei", sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* 頂部進度與重聽欄 */
    #top-bar {
      position: fixed;
      top: 14px;
      left: 84px;
      right: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
      gap: 12px;
    }

    #level-badge {
      background: var(--card-bg);
      border: 3px solid var(--card-border);
      color: var(--text-color);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 1.2rem;
      font-weight: 900;
      white-space: nowrap;
    }

    #progress-bar-container {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .progress-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 3px solid var(--card-border);
      background-color: transparent;
      transition: background-color 0.25s ease, transform 0.25s ease;
    }

    .progress-dot.filled {
      background-color: var(--card-border);
      transform: scale(1.15);
    }

    #replay-audio-btn {
      background: #FFFF00;
      color: #000000;
      border: 3px solid #000000;
      border-radius: 22px;
      padding: 10px 22px;
      font-size: 1.25rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      white-space: nowrap;
    }

    #replay-audio-btn:active {
      transform: scale(0.95);
    }

    /* 主遊戲區：題目文字 + 圖片選項容器 */
    #main-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 82px 16px 24px 16px;
      gap: 20px;
    }

    #prompt-banner {
      font-size: clamp(2rem, 4.5vw, 3.4rem);
      font-weight: 900;
      text-align: center;
      color: var(--text-color);
      letter-spacing: 2px;
      min-height: 1.3em;
    }

    #choices-grid {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 3.5vw, 44px);
      width: 100%;
      flex: 1;
      max-height: 70vh;
    }

    /* 二選一專用：極致拉開至螢幕最左與最右兩端，中間留出超寬防誤觸安全區 */
    #choices-grid.choices-2 {
      width: 100vw;
      max-width: 100vw;
      justify-content: space-between;
      padding: 0 clamp(14px, 2.2vw, 32px);
      gap: 0;
    }

    /* 圖片選擇卡片 */
    .choice-card {
      background-color: var(--card-bg);
      border: 7px solid var(--card-border);
      border-radius: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
      cursor: pointer;
      position: relative;
      transition: transform 0.22s ease, opacity 0.3s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    }

    /* 依選項數量自動調整大卡片尺寸 */
    .choices-1 .choice-card {
      width: min(64vw, 460px);
      height: min(60vh, 460px);
    }

    .choices-2 .choice-card {
      width: min(30vw, 330px);
      height: min(52vh, 390px);
    }

    .choices-3 .choice-card {
      width: min(29vw, 350px);
      height: min(50vh, 380px);
    }

    .choice-card:active {
      transform: scale(0.96);
    }

    .choice-photo-box {
      width: 92%;
      height: 76%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 18px;
      background-color: #2A2A30;
    }

    .choice-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 18px;
      display: block;
    }

    .choice-label {
      margin-top: 12px;
      font-size: clamp(1.6rem, 3vw, 2.5rem);
      font-weight: 900;
      color: var(--subtext-color);
      letter-spacing: 2px;
    }

    .hide-labels .choice-label {
      display: none;
    }

    .hide-labels .choice-photo-box {
      width: 95%;
      height: 92%;
    }

    /* 答對與錯誤提示狀態 */
    .choice-card.correct-hit {
      border-color: #00FF00 !important;
      box-shadow: 0 0 40px rgba(0, 255, 0, 0.85);
      transform: scale(1.06);
      z-index: 15;
    }

    .choice-card.wrong-dimmed {
      opacity: 0.28;
      transform: scale(0.93);
      border-color: #666666;
    }

    .choice-card.hint-pulse {
      animation: hintGlow 1.1s infinite ease-in-out;
    }

    @keyframes hintGlow {
      0%, 100% {
        box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 42px rgba(0, 255, 0, 1);
        transform: scale(1.04);
        border-color: #00FF00;
      }
    }

    /* 煙花粒子 */
    .particle {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 60;
    }

    /* 教師設定按鈕（左上角單按 1 下即開啟） */
    #teacher-trigger {
      position: fixed;
      top: 14px;
      left: 14px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(80, 80, 85, 0.65);
      border: 2px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      cursor: pointer;
    }

    #teacher-trigger:active {
      transform: scale(0.94);
    }

    #teacher-trigger svg.gear-icon {
      width: 28px;
      height: 28px;
      fill: #FFFFFF;
    }

    /* 啟動與休息遮罩畫面 */
    #start-overlay, #break-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 24px;
      text-align: center;
    }

    .big-start-btn {
      background-color: #FFFF00;
      color: #000000;
      border: none;
      border-radius: 28px;
      padding: 28px 56px;
      font-size: 2.2rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 35px rgba(255, 255, 0, 0.6);
      margin-top: 24px;
    }

    .big-start-btn:active {
      transform: scale(0.96);
    }

    #break-overlay {
      display: none;
    }

    .trophy-icon {
      font-size: 6rem;
      margin-bottom: 10px;
    }

    .break-title {
      font-size: 2.5rem;
      font-weight: 900;
      color: #FFFF00;
      margin: 8px 0;
    }

    .break-stats {
      background: #1C1C1E;
      border: 2px solid #444;
      border-radius: 16px;
      padding: 18px 32px;
      margin: 18px 0;
      color: #FFFFFF;
      font-size: 1.25rem;
      line-height: 1.8;
    }

    /* 教師設定面板 */
    #teacher-panel {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 16px;
    }

    .panel-card {
      background-color: var(--panel-bg);
      color: #FFFFFF;
      width: 100%;
      max-width: 860px;
      max-height: 92vh;
      overflow-y: auto;
      border-radius: 20px;
      border: 2px solid var(--border-color);
      padding: 24px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 14px;
      margin-bottom: 18px;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 1.45rem;
      color: #FFFF00;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-box {
      background: #252529;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 800;
      color: #00FF00;
    }

    .stat-label {
      font-size: 0.85rem;
      color: #CCCCCC;
      margin-top: 4px;
    }

    .setting-group {
      margin-bottom: 18px;
    }

    .setting-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 1.05rem;
      color: #EFEFEF;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .opt-btn {
      background: #2C2C30;
      color: #FFFFFF;
      border: 2px solid #48484D;
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 0.94rem;
      font-weight: 600;
      cursor: pointer;
    }

    .opt-btn.active {
      background: #FFFF00;
      color: #000000;
      border-color: #FFFF00;
    }

    /* 自訂照片上傳區樣式 */
    .custom-upload-box {
      background: #232328;
      border: 2px dashed #55555E;
      border-radius: 14px;
      padding: 16px;
    }

    .upload-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .file-pick-btn {
      background: #00D4FF;
      color: #000000;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    #custom-name-input {
      background: #141417;
      color: #FFFFFF;
      border: 2px solid #555;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 1rem;
      flex: 1;
      min-width: 170px;
      user-select: text;
      -webkit-user-select: text;
    }

    #custom-name-input:focus {
      outline: none;
      border-color: #FFFF00;
    }

    #add-custom-btn {
      background: #00FF00;
      color: #000000;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 0.98rem;
      font-weight: 800;
      cursor: pointer;
    }

    #custom-preview-bar {
      display: none;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      padding: 8px 12px;
      background: #18181C;
      border-radius: 10px;
      font-size: 0.9rem;
      color: #FFFF00;
    }

    #custom-preview-thumb {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid #FFFF00;
    }

    #custom-items-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .custom-item-chip {
      background: #2E2E34;
      border: 1px solid #4A4A52;
      border-radius: 12px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      text-align: center;
    }

    .custom-item-chip img {
      width: 68px;
      height: 68px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 6px;
    }

    .custom-item-chip span {
      font-size: 0.92rem;
      font-weight: 700;
      color: #FFFFFF;
      word-break: break-all;
    }

    .del-chip-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #FF3B30;
      color: #FFFFFF;
      border: none;
      font-weight: 900;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #custom-warning-msg {
      display: none;
      color: #FF8A8A;
      font-size: 0.88rem;
      margin-top: 8px;
    }

    .panel-footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
    }

    .action-btn {
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
    }

    .btn-reset {
      background: #3A3A3C;
      color: #FF6B6B;
    }

    .btn-close {
      background: #00FF00;
      color: #000000;
      flex: 1;
    }
  </style>
</head>
<body>

  <!-- 教師設定按鈕（左上角單按 1 下即開啟） -->
  <div id="teacher-trigger" title="開啟教師設定">
    <svg class="gear-icon" viewBox="0 0 24 24">
      <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
    </svg>
  </div>

  <!-- 頂部進度與重聽欄 -->
  <div id="top-bar">
    <div id="level-badge">階段 1：一選一</div>
    <div id="progress-bar-container"></div>
    <button id="replay-audio-btn">🔊 再聽一次</button>
  </div>

  <!-- 主遊戲畫面 -->
  <div id="main-container">
    <div id="prompt-banner">邊個係的士呀？</div>
    <div id="choices-grid" class="choices-1"></div>
  </div>

  <!-- 開始畫面 -->
  <div id="start-overlay">
    <div style="font-size: 5rem;">📸</div>
    <h1 style="font-size: 2.6rem; color: #FFFF00; margin: 12px 0;">智選小達人</h1>
    <p style="font-size: 1.2rem; color: #CCCCCC; max-width: 520px; line-height: 1.6;">
      真實相片選辦訓練（一選一 → 二選一 → 三選一）<br/>
      <span style="font-size: 0.95rem; color: #888;">（進入後按一下左上角齒輪即可開啟教師設定及上傳自訂照片）</span>
    </p>
    <button class="big-start-btn" id="start-btn">開始訓練</button>
  </div>

  <!-- 回合休息獎勵畫面 -->
  <div id="break-overlay">
    <div class="trophy-icon">🏆</div>
    <div class="break-title">好叻喎！做得好！</div>
    <div class="break-stats" id="break-stats-text">
      本回合完成：9 題<br/>
      首次指認準確率：100%
    </div>
    <button class="big-start-btn" id="continue-btn">繼續下一回合</button>
  </div>

  <!-- 教師設定面板 -->
  <div id="teacher-panel">
    <div class="panel-card">
      <div class="panel-header">
        <h2>👩‍🏫 教師選辦訓練設定與評估</h2>
        <span style="font-size: 0.9rem; color: #AAA;">設定即時生效</span>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-value" id="stat-total">0</div>
          <div class="stat-label">累計完成題數</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="stat-accuracy">--</div>
          <div class="stat-label">首次指認準確率</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="stat-stage">一選一</div>
          <div class="stat-label">目前訓練階段</div>
        </div>
      </div>

      <!-- 1. 選辦階段模式 -->
      <div class="setting-group">
        <label>1. 選辦難度階段（選項數量）</label>
        <div class="btn-group" data-setting="stageMode">
          <button class="opt-btn active" data-val="auto">自動進階（一選一 → 二選一 → 三選一）</button>
          <button class="opt-btn" data-val="1">固定：一選一（建立指認因果）</button>
          <button class="opt-btn" data-val="2">固定：二選一（左右兩端分開辨識）</button>
          <button class="opt-btn" data-val="3">固定：三選一（多重視覺搜尋）</button>
        </div>
      </div>

      <!-- 2. 生活圖片主題分類 -->
      <div class="setting-group">
        <label>2. 訓練相片題庫來源與主題</label>
        <div class="btn-group" data-setting="category">
          <button class="opt-btn active" data-val="all">全部真實相片（9 款 ＋ 自訂照片）</button>
          <button class="opt-btn" data-val="vehicle">香港交通工具（的士、地鐵、巴士、復康巴士）</button>
          <button class="opt-btn" data-val="daily">日常用品（牙刷、書包、輪椅、毛巾、波鞋）</button>
          <button class="opt-btn" data-val="custom">⭐ 只用老師自訂照片（家人 / 同學 / 實物）</button>
        </div>
        <div id="custom-warning-msg">⚠️ 提示：自訂照片數量不足目前選辦選項數（建議至少上傳 3 張），系統將暫時自動補入內置相片配對。</div>
      </div>

      <!-- 3. 卡片是否顯示文字名稱 -->
      <div class="setting-group">
        <label>3. 相片下方文字提示（識字與純相片區辨切換）</label>
        <div class="btn-group" data-setting="showText">
          <button class="opt-btn active" data-val="true">顯示相片 ＋ 文字名稱（圖文配對）</button>
          <button class="opt-btn" data-val="false">只顯示相片（純聽覺理解選圖）</button>
        </div>
      </div>

      <!-- 4. 畫面色彩對比模式 -->
      <div class="setting-group">
        <label>4. 畫面視覺對比主題</label>
        <div class="btn-group" data-setting="theme">
          <button class="opt-btn active" data-val="dark">深黑高對比背景（減低眩光）</button>
          <button class="opt-btn" data-val="light">亮白高對比背景（一般教室光線）</button>
        </div>
      </div>

      <!-- 5. 答錯輔助提示 -->
      <div class="setting-group">
        <label>5. 答錯時視覺引導提示</label>

          <button class="opt-btn active" data-val="true">開啟（選錯 1 次後正確相片閃光提示）</button>

      <!-- 7. 上傳自訂照片與名稱 -->
      <div class="setting-group">
        <label>7. 上傳自訂實拍照片（學生家人、同學、老師或真實課室物品）</label>

          <div class="upload-controls">
            <label for="custom-photo-file" class="file-pick-btn">📷 選擇照片 / 拍照</label>

            <input type="text" id="custom-name-input" placeholder="輸入名稱（例如：媽媽、陳老師、水壺）" maxlength="16" />
            <button type="button" id="add-custom-btn">➕ 加入題庫</button>

            <img id="custom-preview-thumb" src="" alt="預覽" />
            <span>已選取照片！請在上方輸入名稱後按「加入題庫」</span>
          </div>
          <div id="custom-items-list"></div>
        </div>
      </div>

      <div class="panel-footer">
        <button class="action-btn btn-reset" id="reset-stats-btn">重設統計數據</button>
        <button class="action-btn btn-close" id="close-panel-btn">儲存並返回訓練</button>
      </div>
    </div>
  </div>

  <script>
    // === 9 款真實攝影相片題庫（香港交通工具 ＋ 日常生活實物） ===
    const BUILTIN_ITEMS = [
      {

    ];

    // 離線或相片載入異常時的後備相片佔位圖
    function makeFallbackDataUrl(label) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
        <rect width="400" height="300" fill="#2C2C32"/>
        <text x="200" y="160" font-size="48" font-weight="bold" fill="#FFFF00" text-anchor="middle" font-family="sans-serif">${label}</text>
      </svg>`;
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

    // === 自訂照片持久化管理（localStorage） ===
    const CUSTOM_STORAGE_KEY = 'smart_matcher_custom_items_v1';
    let customItems = [];
    let pendingPhotoDataUrl = null;

    function loadCustomItems() {
      try {
        const raw = localStorage.getItem(CUSTOM_STORAGE_KEY);
        if (raw) {
          customItems = JSON.parse(raw);
        }
      } catch (e) {
        customItems = [];
      }
    }

    function saveCustomItems() {
      try {
        localStorage.setItem(CUSTOM_STORAGE_KEY, JSON.stringify(customItems));
      } catch (e) {
        alert('儲存空間已滿，請先刪除部分舊照片再新增。');
      }
    }

    loadCustomItems();

    // === 遊戲狀態 ===
    const state = {
      stageMode: 'auto',     // 'auto' | 1 | 2 | 3
      currentChoices: 1,     // 實際當前選項數 1, 2, 3
      streakAtLevel: 0,      // 自動進階用連續一次答對次數
      category: 'all',       // 'all' | 'vehicle' | 'daily' | 'custom'
      showText: true,
      theme: 'dark',
      autoHint: true,
      roundLimit: 9,

      // 統計數據
      totalCompleted: 0,
      firstTryCorrect: 0,
      roundCompleted: 0,
      isFirstTryThisQuestion: true,
      wrongAttemptsThisQuestion: 0,

      // 當前題目
      targetItem: null,
      lastTargetId: '',
      isLocked: false,
      isPaused: true
    };

    const choicesGrid = document.getElementById('choices-grid');
    const promptBanner = document.getElementById('prompt-banner');
    const levelBadge = document.getElementById('level-badge');
    const progressBarContainer = document.getElementById('progress-bar-container');

    // === Web Audio API 音效 ===
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSuccessSound() {
      if (!audioCtx) return;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const now = audioCtx.currentTime + idx * 0.06;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.45);
      });
    }

    function playGentleNudgeSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.linearRampToValueAtTime(270, now + 0.25);
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.28);
    }

    function playFanfareSound() {
      if (!audioCtx) return;
      const melody = [
        { f: 523.25, t: 0, d: 0.15 },
        { f: 659.25, t: 0.15, d: 0.15 },
        { f: 783.99, t: 0.30, d: 0.15 },
        { f: 1046.50, t: 0.48, d: 0.5 }
      ];
      melody.forEach(n => {
        const now = audioCtx.currentTime + n.t;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(n.f, now);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + n.d);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + n.d);
      });
    }

    // === 廣東話語音引擎 ===
    let cantoneseVoice = null;
    let praiseToggle = 0;

    function loadCantoneseVoice() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      cantoneseVoice =
        voices.find(v => v.lang === 'zh-HK' || v.lang === 'zh_HK') ||
        voices.find(v => v.lang.toLowerCase().includes('hk') || v.name.toLowerCase().includes('cantonese') || v.name.includes('粵語') || v.name.includes('廣東話')) ||
        null;
    }

    if ('speechSynthesis' in window) {
      loadCantoneseVoice();
      window.speechSynthesis.onvoiceschanged = loadCantoneseVoice;
    }

    function speakCantonese(text, pitch = 1.15) {
      if (!('speechSynthesis' in window) || !text) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'zh-HK';
      if (cantoneseVoice) {
        utter.voice = cantoneseVoice;
      }
      utter.rate = 0.90;
      utter.pitch = pitch;
      window.speechSynthesis.speak(utter);
    }

    // === 進度條與階段顯示 ===
    function updateHeaderUI() {
      const stageNames = { 1: '階段 1：一選一', 2: '階段 2：二選一', 3: '階段 3：三選一' };
      levelBadge.textContent = stageNames[state.currentChoices] || '一選一';

      progressBarContainer.innerHTML = '';
      if (state.roundLimit <= 0) {
        progressBarContainer.style.display = 'none';
        return;
      }
      progressBarContainer.style.display = 'flex';
      for (let i = 0; i < state.roundLimit; i++) {
        const dot = document.createElement('div');
        dot.className = 'progress-dot' + (i < state.roundCompleted ? ' filled' : '');
        progressBarContainer.appendChild(dot);
      }
    }

    // === 產生新一題（全部使用真實相片） ===
    function generateQuestion() {
      if (state.isPaused) return;
      state.isLocked = false;
      state.isFirstTryThisQuestion = true;
      state.wrongAttemptsThisQuestion = 0;

      if (state.stageMode !== 'auto') {
        state.currentChoices = Number(state.stageMode);
      }
      updateHeaderUI();

      let targetPool = [];
      let distractorPool = [];

      if (state.category === 'custom') {
        if (customItems.length > 0) {
          targetPool = [...customItems];
          distractorPool = customItems.length >= state.currentChoices
            ? [...customItems]
            : [...customItems, ...BUILTIN_ITEMS];
        } else {
          targetPool = [...BUILTIN_ITEMS];
          distractorPool = [...BUILTIN_ITEMS];
        }
      } else if (state.category === 'all') {
        targetPool = [...customItems, ...BUILTIN_ITEMS];
        distractorPool = [...targetPool];
      } else {
        targetPool = BUILTIN_ITEMS.filter(item => item.category === state.category);
        distractorPool = [...targetPool];
      }

      if (targetPool.length === 0) targetPool = [...BUILTIN_ITEMS];
      if (distractorPool.length < state.currentChoices) distractorPool = [...BUILTIN_ITEMS];

      // 挑選目標相片（避免連續重複）
      const candidates = targetPool.length > 1
        ? targetPool.filter(item => item.id !== state.lastTargetId)
        : targetPool;
      const target = candidates[Math.floor(Math.random() * candidates.length)];
      state.targetItem = target;
      state.lastTargetId = target.id;

      // 挑選干擾項
      const distractors = distractorPool
        .filter(item => item.id !== target.id && item.name !== target.name)
        .sort(() => Math.random() - 0.5)
        .slice(0, state.currentChoices - 1);

      const options = [target, ...distractors].sort(() => Math.random() - 0.5);

      // 更新題目文字與廣東話語音提問
      const questionText = `邊個係${target.name}呀？`;
      promptBanner.textContent = questionText;
      speakCantonese(questionText, 1.12);

      // 渲染真實相片卡片
      choicesGrid.className = `choices-${state.currentChoices}` + (state.showText ? '' : ' hide-labels');
      choicesGrid.innerHTML = '';

      options.forEach(item => {
        const card = document.createElement('div');
        card.className = 'choice-card';
        card.dataset.id = item.id;

        const photoBox = document.createElement('div');
        photoBox.className = 'choice-photo-box';

        const img = document.createElement('img');
        img.className = 'choice-photo';
        img.alt = item.name;
        img.src = item.imageUrl;
        img.onerror = function() {
          if (item.backupUrl && this.src !== item.backupUrl) {
            this.src = item.backupUrl;
          } else {
            this.onerror = null;
            this.src = makeFallbackDataUrl(item.name);
          }
        };

        photoBox.appendChild(img);
        card.appendChild(photoBox);

        const labelDiv = document.createElement('div');
        labelDiv.className = 'choice-label';
        labelDiv.textContent = item.name;
        card.appendChild(labelDiv);

        card.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          handleChoiceClick(card, item);
        });

        choicesGrid.appendChild(card);
      });
    }

    // === 處理學生點擊卡片 ===
    function handleChoiceClick(cardEl, chosenItem) {
      if (state.isLocked || state.isPaused) return;
      if (cardEl.classList.contains('wrong-dimmed')) return;

      if (chosenItem.id === state.targetItem.id) {
        state.isLocked = true;
        cardEl.classList.remove('hint-pulse');
        cardEl.classList.add('correct-hit');

        document.querySelectorAll('.choice-card').forEach(c => {
          if (c !== cardEl) c.classList.add('wrong-dimmed');
        });

        const rect = cardEl.getBoundingClientRect();
        spawnCelebrationParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);
        playSuccessSound();
        if (navigator.vibrate) navigator.vibrate(70);

        state.totalCompleted += 1;
        state.roundCompleted += 1;
        if (state.isFirstTryThisQuestion) {
          state.firstTryCorrect += 1;
          state.streakAtLevel += 1;
        } else {
          state.streakAtLevel = 0;
        }

        const praises = ['好叻喎！', '做得好！'];
        const praiseWord = praises[praiseToggle % praises.length];
        praiseToggle += 1;
        speakCantonese(`${praiseWord}係${state.targetItem.name}呀！`, 1.18);

        updateHeaderUI();
        updateStatsUI();

        if (state.stageMode === 'auto' && state.streakAtLevel >= 3 && state.currentChoices < 3) {
          state.currentChoices += 1;
          state.streakAtLevel = 0;
        }

        if (state.roundLimit > 0 && state.roundCompleted >= state.roundLimit) {
          setTimeout(showRoundBreak, 1200);
        } else {
          setTimeout(generateQuestion, 1450);
        }
      } else {
        state.isFirstTryThisQuestion = false;
        state.wrongAttemptsThisQuestion += 1;
        state.streakAtLevel = 0;

        cardEl.classList.add('wrong-dimmed');
        playGentleNudgeSound();
        speakCantonese(`再試下啦，邊個係${state.targetItem.name}呀？`, 1.08);

        if (state.autoHint) {
          const correctCard = document.querySelector(`.choice-card[data-id="${state.targetItem.id}"]`);
          if (correctCard) correctCard.classList.add('hint-pulse');
        }
      }
    }

    function spawnCelebrationParticles(cx, cy) {
      const colors = ['#FFFF00', '#00FF00', '#FF3366', '#00D4FF'];
      for (let i = 0; i < 18; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = 14 + Math.random() * 14;
        p.style.width = `${size}px`;
        p.style.height = `${size}px`;
        p.style.backgroundColor = colors[i % colors.length];
        p.style.left = `${cx}px`;
        p.style.top = `${cy}px`;
        document.body.appendChild(p);

        const angle = (Math.PI * 2 * i) / 18;
        const dist = 90 + Math.random() * 150;
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist;

        p.animate([
          { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
          { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0.2)`, opacity: 0 }
        ], {
          duration: 620,
          easing: 'cubic-bezier(0.16, 1, 0.3, 1)'
        }).onfinish = () => p.remove();
      }
    }

    document.getElementById('replay-audio-btn').addEventListener('click', () => {
      initAudio();
      if (state.targetItem && !state.isPaused) {
        speakCantonese(`邊個係${state.targetItem.name}呀？`, 1.12);
      }
    });

    // === 回合結束休息獎勵畫面 ===
    function showRoundBreak() {
      state.isPaused = true;
      playFanfareSound();
      speakCantonese('好叻喎，做得好！完成一回合啦，休息一陣先！', 1.18);

      const accuracy = state.totalCompleted > 0
        ? Math.round((state.firstTryCorrect / state.totalCompleted) * 100)
        : 100;

      const stageText = { 1: '一選一', 2: '二選一', 3: '三選一' }[state.currentChoices];

      document.getElementById('break-stats-text').innerHTML = `
        本回合完成：<strong>${state.roundCompleted}</strong> 題<br/>
        目前選辦階段：<strong>${stageText}</strong><br/>
        累計首次指認準確率：<strong>${accuracy}%</strong>
      `;

      document.getElementById('break-overlay').style.display = 'flex';
    }

    document.getElementById('continue-btn').addEventListener('click', () => {
      initAudio();
      state.roundCompleted = 0;
      document.getElementById('break-overlay').style.display = 'none';
      state.isPaused = false;
      generateQuestion();
    });

    // === 自訂照片上傳與自動壓縮處理 ===
    const fileInput = document.getElementById('custom-photo-file');
    const nameInput = document.getElementById('custom-name-input');
    const previewBar = document.getElementById('custom-preview-bar');
    const previewThumb = document.getElementById('custom-preview-thumb');
    const customListEl = document.getElementById('custom-items-list');

    function compressImageFile(file, maxSize = 480) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > h) {
              if (w > maxSize) {
                h = Math.round((h * maxSize) / w);
                w = maxSize;
              }
            } else {
              if (h > maxSize) {
                w = Math.round((w * maxSize) / h);
                h = maxSize;
              }
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.85));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      pendingPhotoDataUrl = await compressImageFile(file, 480);
      previewThumb.src = pendingPhotoDataUrl;
      previewBar.style.display = 'flex';
      if (!nameInput.value.trim()) {
        nameInput.focus();
      }
    });

    document.getElementById('add-custom-btn').addEventListener('click', () => {
      const cleanName = nameInput.value.trim();
      if (!pendingPhotoDataUrl) {
        alert('請先按「📷 選擇照片 / 拍照」選取一張相片！');
        return;
      }
      if (!cleanName) {
        alert('請輸入這張相片的名稱（例如：媽媽、陳老師、水壺）！');
        nameInput.focus();
        return;
      }

      customItems.push({
        id: 'custom_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
        name: cleanName,
        category: 'custom',
        imageUrl: pendingPhotoDataUrl
      });

      saveCustomItems();
      pendingPhotoDataUrl = null;
      fileInput.value = '';
      nameInput.value = '';
      previewBar.style.display = 'none';
      renderCustomItemsList();
      checkCustomWarning();
    });

    function renderCustomItemsList() {
      customListEl.innerHTML = '';
      customItems.forEach((item, idx) => {
        const chip = document.createElement('div');
        chip.className = 'custom-item-chip';
        chip.innerHTML = `
          <button type="button" class="del-chip-btn" title="刪除此照片">✕</button>
          <img src="${item.imageUrl}" alt="${item.name}" />
          <span>${item.name}</span>
        `;
        chip.querySelector('.del-chip-btn').addEventListener('click', () => {
          customItems.splice(idx, 1);
          saveCustomItems();
          renderCustomItemsList();
          checkCustomWarning();
        });
        customListEl.appendChild(chip);
      });
    }

    function checkCustomWarning() {
      const warnEl = document.getElementById('custom-warning-msg');
      warnEl.style.display = (state.category === 'custom' && customItems.length < 3)
        ? 'block'
        : 'none';
    }

    // === 教師設定按鈕（單按 1 下即開啟） ===
    const trigger = document.getElementById('teacher-trigger');
    const teacherPanel = document.getElementById('teacher-panel');

    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      openTeacherPanel();
    });

    function openTeacherPanel() {
      state.isPaused = true;
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      renderCustomItemsList();
      checkCustomWarning();
      updateStatsUI();
      teacherPanel.style.display = 'flex';
    }

    function updateStatsUI() {
      document.getElementById('stat-total').textContent = state.totalCompleted;
      const accuracy = state.totalCompleted > 0
        ? Math.round((state.firstTryCorrect / state.totalCompleted) * 100) + '%'
        : '--';
      document.getElementById('stat-accuracy').textContent = accuracy;
      document.getElementById('stat-stage').textContent =
        { 1: '一選一', 2: '二選一', 3: '三選一' }[state.currentChoices];
    }

    document.querySelectorAll('.btn-group').forEach(group => {
      const settingKey = group.dataset.setting;
      group.querySelectorAll('.opt-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll(`.btn-group[data-setting="${settingKey}"] .opt-btn`).forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          let val = btn.dataset.val;
          if (settingKey === 'roundLimit') {
            val = Number(val);
            state.roundCompleted = 0;
          } else if (settingKey === 'showText' || settingKey === 'autoHint') {
            val = (val === 'true');
          } else if (settingKey === 'stageMode') {
            if (val !== 'auto') {
              state.currentChoices = Number(val);
            } else {
              state.currentChoices = 1;
              state.streakAtLevel = 0;
            }
          }
          state[settingKey] = val;

          if (settingKey === 'theme') {
            document.body.classList.toggle('light-theme', val === 'light');
          }
          checkCustomWarning();
          updateStatsUI();
        });
      });
    });

    document.getElementById('reset-stats-btn').addEventListener('click', () => {
      state.totalCompleted = 0;
      state.firstTryCorrect = 0;
      state.roundCompleted = 0;
      state.streakAtLevel = 0;
      if (state.stageMode === 'auto') state.currentChoices = 1;
      updateHeaderUI();
      updateStatsUI();
    });

    document.getElementById('close-panel-btn').addEventListener('click', () => {
      teacherPanel.style.display = 'none';
      if (document.getElementById('break-overlay').style.display !== 'flex') {
        state.isPaused = false;
        generateQuestion();
      }
    });

    // === 啟動遊戲 ===
    document.getElementById('start-btn').addEventListener('click', () => {
      initAudio();
      loadCantoneseVoice();
      document.getElementById('start-overlay').style.display = 'none';
      state.isPaused = false;
      generateQuestion();
    });
  </script>
</body>
</html>
