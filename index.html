<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>智選小達人 - 多學生獨立檔案選辦訓練</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #18181C;
      --card-border: #FFFF00;
      --text-color: #FFFF00;
      --subtext-color: #FFFFFF;
      --accent-color: #00FF00;
      --panel-bg: #161618;
      --border-color: #444444;
    }

    body.light-theme {
      --bg-color: #F4F6F9;
      --card-bg: #FFFFFF;
      --card-border: #002868;
      --text-color: #002868;
      --subtext-color: #111111;
      --accent-color: #008A00;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Microsoft JhengHei", sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* 頂部進度與重聽欄 */
    #top-bar {
      position: fixed;
      top: 14px;
      left: 84px;
      right: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
      gap: 12px;
    }

    .top-badges-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    #student-name-badge {
      background: #002868;
      border: 3px solid #00D4FF;
      color: #FFFFFF;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 1.15rem;
      font-weight: 900;
      white-space: nowrap;
      cursor: pointer;
    }

    #level-badge {
      background: var(--card-bg);
      border: 3px solid var(--card-border);
      color: var(--text-color);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 1.15rem;
      font-weight: 900;
      white-space: nowrap;
    }

    #progress-bar-container {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .progress-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 3px solid var(--card-border);
      background-color: transparent;
      transition: background-color 0.25s ease, transform 0.25s ease;
    }

    .progress-dot.filled {
      background-color: var(--card-border);
      transform: scale(1.15);
    }

    #replay-audio-btn {
      background: #FFFF00;
      color: #000000;
      border: 3px solid #000000;
      border-radius: 22px;
      padding: 10px 22px;
      font-size: 1.25rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      white-space: nowrap;
    }

    #replay-audio-btn:active {
      transform: scale(0.95);
    }

    /* 主遊戲區 */
    #main-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 12px 20px 12px;
      gap: 18px;
    }

    #prompt-banner {
      font-size: clamp(2rem, 4.5vw, 3.4rem);
      font-weight: 900;
      text-align: center;
      color: var(--text-color);
      letter-spacing: 2px;
      min-height: 1.3em;
    }

    #choices-grid {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 3.5vw, 44px);
      width: 100%;
      flex: 1;
      max-height: 74vh;
    }

    /* 二選一專用：超大卡片 + 左右極致分開 */
    #choices-grid.choices-2 {
      width: 100vw;
      max-width: 100vw;
      justify-content: space-between;
      padding: 0 clamp(14px, 2vw, 28px);
      gap: clamp(48px, 10vw, 150px);
    }

    /* 圖片選擇卡片 */
    .choice-card {
      background-color: var(--card-bg);
      border: 8px solid var(--card-border);
      border-radius: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      cursor: pointer;
      position: relative;
      transition: transform 0.22s ease, opacity 0.3s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    }

    .choices-1 .choice-card {
      width: min(68vw, 520px);
      height: min(64vh, 520px);
    }

    .choices-2 .choice-card {
      width: min(41vw, 500px);
      height: min(62vh, 500px);
    }

    .choices-3 .choice-card {
      width: min(30vw, 390px);
      height: min(55vh, 430px);
    }

    .choice-card:active {
      transform: scale(0.96);
    }

    .choice-media-box {
      width: 94%;
      height: 78%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 18px;
      background-color: #222226;
    }

    .choice-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 18px;
      display: block;
    }

    .choice-label {
      margin-top: 12px;
      font-size: clamp(1.7rem, 3.2vw, 2.7rem);
      font-weight: 900;
      color: var(--subtext-color);
      letter-spacing: 2px;
    }

    .hide-labels .choice-label {
      display: none;
    }

    .hide-labels .choice-media-box {
      width: 96%;
      height: 94%;
    }

    /* 答對與錯誤提示狀態 */
    .choice-card.correct-hit {
      border-color: #00FF00 !important;
      box-shadow: 0 0 40px rgba(0, 255, 0, 0.85);
      transform: scale(1.04);
      z-index: 15;
    }

    .choice-card.wrong-dimmed {
      opacity: 0.28;
      transform: scale(0.95);
      border-color: #666666;
    }

    .choice-card.hint-pulse {
      animation: hintGlow 1.1s infinite ease-in-out;
    }

    @keyframes hintGlow {
      0%, 100% {
        box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 42px rgba(0, 255, 0, 1);
        transform: scale(1.03);
        border-color: #00FF00;
      }
    }

    /* 煙花粒子 */
    .particle {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 60;
    }

    /* 教師設定按鈕（左上角單按 1 下即開啟） */
    #teacher-trigger {
      position: fixed;
      top: 14px;
      left: 14px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(80, 80, 85, 0.75);
      border: 2px solid rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      cursor: pointer;
    }

    #teacher-trigger:active {
      transform: scale(0.94);
    }

    #teacher-trigger svg.gear-icon {
      width: 28px;
      height: 28px;
      fill: #FFFFFF;
    }

    /* 啟動與休息遮罩畫面 */
    #start-overlay, #break-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 24px;
      text-align: center;
      overflow-y: auto;
    }

    /* 開始畫面學生檔案選擇牆 */
    #start-student-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      max-width: 820px;
      margin: 18px 0;
    }

    .student-pick-card {
      background: #1E1E24;
      border: 3px solid #555560;
      border-radius: 20px;
      padding: 16px 26px;
      min-width: 190px;
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.2s ease;
      text-align: center;
    }

    .student-pick-card.selected {
      border-color: #FFFF00;
      background: #2C2C18;
      box-shadow: 0 0 24px rgba(255, 255, 0, 0.45);
      transform: scale(1.04);
    }

    .student-pick-card .s-name {
      font-size: 1.5rem;
      font-weight: 900;
      color: #FFFFFF;
    }

    .student-pick-card.selected .s-name {
      color: #FFFF00;
    }

    .student-pick-card .s-meta {
      font-size: 0.95rem;
      color: #AAAAAA;
      margin-top: 6px;
    }

    .new-student-card-btn {
      background: #162836;
      border: 3px dashed #00D4FF;
      border-radius: 20px;
      padding: 16px 26px;
      min-width: 190px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #00D4FF;
      font-size: 1.25rem;
      font-weight: 900;
    }

    .start-actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      margin-top: 12px;
    }

    .big-start-btn {
      background-color: #FFFF00;
      color: #000000;
      border: none;
      border-radius: 24px;
      padding: 22px 46px;
      font-size: 1.9rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 35px rgba(255, 255, 0, 0.55);
    }

    .big-start-btn:active {
      transform: scale(0.96);
    }

    .secondary-setup-btn {
      background-color: #00D4FF;
      color: #000000;
      border: none;
      border-radius: 24px;
      padding: 22px 34px;
      font-size: 1.55rem;
      font-weight: 900;
      cursor: pointer;
    }

    #break-overlay {
      display: none;
    }

    .trophy-icon {
      font-size: 6rem;
      margin-bottom: 10px;
    }

    .break-title {
      font-size: 2.5rem;
      font-weight: 900;
      color: #FFFF00;
      margin: 8px 0;
    }

    .break-stats {
      background: #1C1C1E;
      border: 2px solid #444;
      border-radius: 16px;
      padding: 18px 32px;
      margin: 18px 0;
      color: #FFFFFF;
      font-size: 1.25rem;
      line-height: 1.8;
    }

    /* 教師設定面板 */
    #teacher-panel {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 16px;
    }

    .panel-card {
      background-color: var(--panel-bg);
      color: #FFFFFF;
      width: 100%;
      max-width: 920px;
      max-height: 92vh;
      overflow-y: auto;
      border-radius: 20px;
      border: 2px solid var(--border-color);
      padding: 24px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 14px;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 1.45rem;
      color: #FFFF00;
    }

    /* 學生檔案切換與管理區塊 */
    .profile-manager-box {
      background: #1E2430;
      border: 2px solid #00D4FF;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .profile-tabs-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    .profile-tab-btn {
      background: #2C3444;
      color: #FFFFFF;
      border: 2px solid #4C5870;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
    }

    .profile-tab-btn.active {
      background: #00D4FF;
      color: #000000;
      border-color: #00D4FF;
    }

    .add-profile-btn {
      background: #00FF00;
      color: #000000;
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
    }

    .profile-edit-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid #354054;
    }

    #current-student-name-input {
      background: #12161F;
      color: #FFFF00;
      border: 2px solid #55627A;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 1.05rem;
      font-weight: 800;
      flex: 1;
      min-width: 180px;
      user-select: text;
      -webkit-user-select: text;
    }

    #current-student-name-input:focus {
      outline: none;
      border-color: #FFFF00;
    }

    .delete-profile-btn {
      background: #4A1E1E;
      color: #FF8A8A;
      border: 1px solid #FF5252;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-box {
      background: #252529;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 800;
      color: #00FF00;
    }

    .stat-label {
      font-size: 0.85rem;
      color: #CCCCCC;
      margin-top: 4px;
    }

    .setting-group {
      margin-bottom: 20px;
    }

    .setting-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 1.05rem;
      color: #EFEFEF;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .opt-btn {
      background: #2C2C30;
      color: #FFFFFF;
      border: 2px solid #48484D;
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 0.94rem;
      font-weight: 600;
      cursor: pointer;
    }

    .opt-btn.active {
      background: #FFFF00;
      color: #000000;
      border-color: #FFFF00;
    }

    /* iPad 相片上傳與題庫管理區 */
    .custom-upload-box {
      background: #232328;
      border: 2px dashed #FFFF00;
      border-radius: 16px;
      padding: 18px;
    }

    .upload-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .file-pick-btn {
      background: #00D4FF;
      color: #000000;
      padding: 13px 20px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 1.02rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .camera-pick-btn {
      background: #FFB800;
      color: #000000;
      padding: 13px 20px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 1.02rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* 批量待確認清單 */
    #pending-batch-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }

    .pending-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #16161A;
      border: 2px solid #FFFF00;
      border-radius: 12px;
      padding: 8px 12px;
    }

    .pending-row img {
      width: 62px;
      height: 62px;
      object-fit: cover;
      border-radius: 8px;
    }

    .pending-row input {
      background: #2A2A30;
      color: #FFFFFF;
      border: 2px solid #666;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 1.05rem;
      flex: 1;
      user-select: text;
      -webkit-user-select: text;
    }

    .pending-row input:focus {
      outline: none;
      border-color: #00FF00;
    }

    #save-batch-btn {
      display: none;
      margin-top: 12px;
      width: 100%;
      background: #00FF00;
      color: #000000;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
    }

    .saved-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #3C3C44;
      flex-wrap: wrap;
      gap: 8px;
    }

    .clear-all-btn {
      background: #4A2020;
      color: #FF8A8A;
      border: 1px solid #FF5252;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* 已儲存相片管理網格 */
    .items-manage-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .manage-card {
      background: #2B2B32;
      border: 1px solid #4A4A52;
      border-radius: 12px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      text-align: center;
    }

    .manage-card .thumb-box {
      width: 88px;
      height: 88px;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 8px;
      background: #1C1C20;
    }

    .manage-card .thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .manage-card .rename-input {
      width: 100%;
      background: #1C1C22;
      color: #FFFFFF;
      border: 1px solid #555;
      border-radius: 6px;
      padding: 5px 6px;
      font-size: 0.95rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
      user-select: text;
      -webkit-user-select: text;
    }

    .manage-card .rename-input:focus {
      outline: none;
      border-color: #FFFF00;
    }

    .replace-photo-btn {
      background: #3B82F6;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }

    .del-chip-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #FF3B30;
      color: #FFFFFF;
      border: none;
      font-weight: 900;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #empty-bank-hint {
      color: #AAAAAA;
      font-size: 0.95rem;
      padding: 18px;
      text-align: center;
      background: #1B1B20;
      border-radius: 10px;
      margin-top: 10px;
    }

    .panel-footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
    }

    .action-btn {
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
    }

    .btn-reset {
      background: #3A3A3C;
      color: #FF6B6B;
    }

    .btn-close {
      background: #00FF00;
      color: #000000;
      flex: 1;
    }
  </style>
</head>
<body>

  <!-- 隱藏的單題換相 input -->
  <input type="file" id="replace-single-input" accept="image/*" style="display:none;" />

  <!-- 教師設定按鈕（左上角單按 1 下即開啟） -->
  <div id="teacher-trigger" title="開啟教師設定與學生檔案">
    <svg class="gear-icon" viewBox="0 0 24 24">

  <script>
    // === 多學生檔案儲存結構（每位學生擁有獨立相片庫、難度設定及統計數據） ===
    const PROFILES_STORAGE_KEY = 'smart_matcher_student_profiles_v1';
    const ACTIVE_ID_STORAGE_KEY = 'smart_matcher_active_student_id_v1';

    let profiles = [];
    let activeStudentId = '';
    let pendingBatchItems = [];
    let replacingTargetId = null;

    function createDefaultProfile(name) {
      return {
        id: 'stu_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
        name: name,
        items: [], // [{ id, name, imageUrl }]
        settings: {
          stageMode: 'auto',
          currentChoices: 1,
          streakAtLevel: 0,
          showText: true,
          theme: 'dark',
          autoHint: true,
          roundLimit: 9
        },
        stats: {
          totalCompleted: 0,
          firstTryCorrect: 0
        }
      };
    }

    function loadAllProfiles() {
      try {
        const raw = localStorage.getItem(PROFILES_STORAGE_KEY);
        if (raw) profiles = JSON.parse(raw);
      } catch (e) {
        profiles = [];
      }

      // 遷移舊版單一題庫資料（如果之前已經上傳過相片，自動保留到第一個學生檔案中）
      if (profiles.length === 0) {
        const defaultStu = createDefaultProfile('學生 1');
        try {
          const legacyRaw = localStorage.getItem('smart_matcher_pure_custom_v1');
          if (legacyRaw) {
            const legacyItems = JSON.parse(legacyRaw);
            if (Array.isArray(legacyItems) && legacyItems.length > 0) {
              defaultStu.items = legacyItems;
            }
          }
        } catch (e) {}
        profiles.push(defaultStu);
      }

      const savedActiveId = localStorage.getItem(ACTIVE_ID_STORAGE_KEY);
      if (savedActiveId && profiles.some(p => p.id === savedActiveId)) {
        activeStudentId = savedActiveId;
      } else {
        activeStudentId = profiles[0].id;
      }
      saveAllProfiles();
    }

    function saveAllProfiles() {
      try {
        localStorage.setItem(PROFILES_STORAGE_KEY, JSON.stringify(profiles));
        localStorage.setItem(ACTIVE_ID_STORAGE_KEY, activeStudentId);
      } catch (e) {
        alert('iPad 瀏覽器儲存空間已滿，請先刪除部分舊相片或舊學生檔案再新增。');
      }
    }

    function getActiveProfile() {
      let p = profiles.find(item => item.id === activeStudentId);
      if (!p) {
        p = profiles[0];
        activeStudentId = p.id;
      }
      return p;
    }

    // === 當前訓練執行狀態 ===
    const runtime = {
      roundCompleted: 0,
      isFirstTryThisQuestion: true,
      wrongAttemptsThisQuestion: 0,
      targetItem: null,
      lastTargetId: '',
      isLocked: false,
      isPaused: true
    };

    const choicesGrid = document.getElementById('choices-grid');
    const promptBanner = document.getElementById('prompt-banner');
    const levelBadge = document.getElementById('level-badge');
    const studentNameBadge = document.getElementById('student-name-badge');
    const progressBarContainer = document.getElementById('progress-bar-container');

    loadAllProfiles();

    // === 套用目前學生的視覺主題與設定按鈕狀態 ===
    function applyActiveProfileSettings() {
      const profile = getActiveProfile();
      const s = profile.settings;

      document.body.classList.toggle('light-theme', s.theme === 'light');
      studentNameBadge.textContent = `👤 ${profile.name}`;

      // 同步設定面板內的按鈕高亮狀態
      document.querySelectorAll('.btn-group').forEach(group => {
        const key = group.dataset.setting;
        const currentVal = String(s[key]);
        group.querySelectorAll('.opt-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.val === currentVal);
        });
      });
    }

    // === 渲染開始畫面的學生名牌選擇牆 ===
    function renderStartScreenProfiles() {
      const grid = document.getElementById('start-student-grid');
      grid.innerHTML = '';

      profiles.forEach(p => {
        const card = document.createElement('div');
        card.className = 'student-pick-card' + (p.id === activeStudentId ? ' selected' : '');
        const stageLabel = p.settings.stageMode === 'auto'
          ? `自動（目前 ${p.settings.currentChoices} 選一）`
          : `固定 ${p.settings.stageMode} 選一`;

        card.innerHTML = `
          <div class="s-name">👤 ${p.name}</div>
          <div class="s-meta">相片：${p.items.length} 張 ｜ ${stageLabel}</div>
        `;
        card.addEventListener('click', () => {
          activeStudentId = p.id;
          runtime.roundCompleted = 0;
          runtime.lastTargetId = '';
          saveAllProfiles();
          applyActiveProfileSettings();
          renderStartScreenProfiles();
        });
        grid.appendChild(card);
      });

      // 新增學生按鈕
      const addBtn = document.createElement('div');
      addBtn.className = 'new-student-card-btn';
      addBtn.innerHTML = `
        <div style="font-size: 1.8rem; margin-bottom: 4px;">➕</div>
        <div>新增學生檔案</div>
      `;
      addBtn.addEventListener('click', () => {
        promptCreateNewStudent(true);
      });
      grid.appendChild(addBtn);
    }

    function promptCreateNewStudent(openPanelAfter = false) {
      const defaultName = `學生 ${profiles.length + 1}`;
      const inputName = prompt('請輸入新學生姓名或代號（例如：陳大文、A組小明）：', defaultName);
      if (inputName === null) return;
      const cleanName = inputName.trim() || defaultName;

      const newProfile = createDefaultProfile(cleanName);
      profiles.push(newProfile);
      activeStudentId = newProfile.id;
      runtime.roundCompleted = 0;
      runtime.lastTargetId = '';
      saveAllProfiles();
      applyActiveProfileSettings();
      renderStartScreenProfiles();

      if (openPanelAfter) {
        document.getElementById('start-overlay').style.display = 'none';
        openTeacherPanel();
      } else {
        renderProfileTabsInPanel();
        renderManageLists();
        updateStatsUI();
      }
    }

    // === Web Audio API 音效 ===
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSuccessSound() {
      if (!audioCtx) return;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const now = audioCtx.currentTime + idx * 0.06;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.45);
      });
    }

    function playGentleNudgeSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.linearRampToValueAtTime(270, now + 0.25);
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.28);
    }

    function playFanfareSound() {
      if (!audioCtx) return;
      const melody = [
        { f: 523.25, t: 0, d: 0.15 },
        { f: 659.25, t: 0.15, d: 0.15 },
        { f: 783.99, t: 0.30, d: 0.15 },
        { f: 1046.50, t: 0.48, d: 0.5 }
      ];
      melody.forEach(n => {
        const now = audioCtx.currentTime + n.t;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(n.f, now);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + n.d);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + n.d);
      });
    }

    // === 廣東話語音引擎 ===
    let cantoneseVoice = null;
    let praiseToggle = 0;

    function loadCantoneseVoice() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      cantoneseVoice =
        voices.find(v => v.lang === 'zh-HK' || v.lang === 'zh_HK') ||
        voices.find(v => v.lang.toLowerCase().includes('hk') || v.name.toLowerCase().includes('cantonese') || v.name.includes('粵語') || v.name.includes('廣東話')) ||
        null;
    }

    if ('speechSynthesis' in window) {
      loadCantoneseVoice();
      window.speechSynthesis.onvoiceschanged = loadCantoneseVoice;
    }

    function speakCantonese(text, pitch = 1.15) {
      if (!('speechSynthesis' in window) || !text) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'zh-HK';
      if (cantoneseVoice) {
        utter.voice = cantoneseVoice;
      }
      utter.rate = 0.90;
      utter.pitch = pitch;
      window.speechSynthesis.speak(utter);
    }

    // === 頂部狀態列更新 ===
    function updateHeaderUI(effectiveChoices) {
      const profile = getActiveProfile();
      const s = profile.settings;
      const choicesToShow = effectiveChoices || s.currentChoices;

      studentNameBadge.textContent = `👤 ${profile.name}`;
      const stageNames = { 1: '階段 1：一選一', 2: '階段 2：二選一', 3: '階段 3：三選一' };
      levelBadge.textContent = stageNames[choicesToShow] || '一選一';

      progressBarContainer.innerHTML = '';
      if (s.roundLimit <= 0) {
        progressBarContainer.style.display = 'none';
        return;
      }
      progressBarContainer.style.display = 'flex';
      for (let i = 0; i < s.roundLimit; i++) {
        const dot = document.createElement('div');
        dot.className = 'progress-dot' + (i < runtime.roundCompleted ? ' filled' : '');
        progressBarContainer.appendChild(dot);
      }
    }

    // === 產生新一題（僅使用目前選定學生的專屬相片） ===
    function generateQuestion() {
      if (runtime.isPaused) return;

      const profile = getActiveProfile();
      const items = profile.items;
      const s = profile.settings;

      if (items.length === 0) {
        promptBanner.textContent = `「${profile.name}」未有相片，請先上傳相片`;
        choicesGrid.innerHTML = '';
        openTeacherPanel();
        return;
      }

      runtime.isLocked = false;
      runtime.isFirstTryThisQuestion = true;
      runtime.wrongAttemptsThisQuestion = 0;

      if (s.stageMode !== 'auto') {
        s.currentChoices = Number(s.stageMode);
      }

      const uniqueNamesCount = new Set(items.map(i => i.name)).size;
      const maxAvailableChoices = Math.max(1, Math.min(3, uniqueNamesCount));
      const effectiveChoices = Math.min(s.currentChoices, maxAvailableChoices);

      updateHeaderUI(effectiveChoices);

      const candidates = items.length > 1
        ? items.filter(item => item.id !== runtime.lastTargetId)
        : items;
      const target = candidates[Math.floor(Math.random() * candidates.length)];
      runtime.targetItem = target;
      runtime.lastTargetId = target.id;

      const distractors = items
        .filter(item => item.id !== target.id && item.name !== target.name)
        .sort(() => Math.random() - 0.5)
        .slice(0, effectiveChoices - 1);

      const options = [target, ...distractors].sort(() => Math.random() - 0.5);

      const questionText = `邊個係${target.name}呀？`;
      promptBanner.textContent = questionText;
      speakCantonese(questionText, 1.12);

      choicesGrid.className = `choices-${effectiveChoices}` + (s.showText ? '' : ' hide-labels');
      choicesGrid.innerHTML = '';

      options.forEach(item => {
        const card = document.createElement('div');
        card.className = 'choice-card';
        card.dataset.id = item.id;

        card.innerHTML = `
          <div class="choice-media-box">
            <img class="choice-photo" src="${item.imageUrl}" alt="${item.name}" />
          </div>
          <div class="choice-label">${item.name}</div>
        `;

        card.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          handleChoiceClick(card, item);
        });

        choicesGrid.appendChild(card);
      });
    }

    // === 處理學生點擊卡片 ===
    function handleChoiceClick(cardEl, chosenItem) {
      if (runtime.isLocked || runtime.isPaused) return;
      if (cardEl.classList.contains('wrong-dimmed')) return;

      const profile = getActiveProfile();
      const s = profile.settings;

      if (chosenItem.id === runtime.targetItem.id) {
        runtime.isLocked = true;
        cardEl.classList.remove('hint-pulse');
        cardEl.classList.add('correct-hit');

        document.querySelectorAll('.choice-card').forEach(c => {
          if (c !== cardEl) c.classList.add('wrong-dimmed');
        });

        const rect = cardEl.getBoundingClientRect();
        spawnCelebrationParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);
        playSuccessSound();
        if (navigator.vibrate) navigator.vibrate(70);

        profile.stats.totalCompleted += 1;
        runtime.roundCompleted += 1;
        if (runtime.isFirstTryThisQuestion) {
          profile.stats.firstTryCorrect += 1;
          s.streakAtLevel += 1;
        } else {
          s.streakAtLevel = 0;
        }

        const praises = ['好叻喎！', '做得好！'];
        const praiseWord = praises[praiseToggle % praises.length];
        praiseToggle += 1;
        speakCantonese(`${praiseWord}係${runtime.targetItem.name}呀！`, 1.18);

        if (s.stageMode === 'auto' && s.streakAtLevel >= 3 && s.currentChoices < 3) {
          s.currentChoices += 1;
          s.streakAtLevel = 0;
        }

        saveAllProfiles();
        updateHeaderUI();
        updateStatsUI();

        if (s.roundLimit > 0 && runtime.roundCompleted >= s.roundLimit) {
          setTimeout(showRoundBreak, 1200);
        } else {
          setTimeout(generateQuestion, 1450);
        }
      } else {
        runtime.isFirstTryThisQuestion = false;
        runtime.wrongAttemptsThisQuestion += 1;
        s.streakAtLevel = 0;
        saveAllProfiles();

        cardEl.classList.add('wrong-dimmed');
        playGentleNudgeSound();
        speakCantonese(`再試下啦，邊個係${runtime.targetItem.name}呀？`, 1.08);

        if (s.autoHint) {
          const correctCard = document.querySelector(`.choice-card[data-id="${runtime.targetItem.id}"]`);
          if (correctCard) correctCard.classList.add('hint-pulse');
        }
      }
    }

    function spawnCelebrationParticles(cx, cy) {
      const colors = ['#FFFF00', '#00FF00', '#FF3366', '#00D4FF'];
      for (let i = 0; i < 18; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = 14 + Math.random() * 14;
        p.style.width = `${size}px`;
        p.style.height = `${size}px`;
        p.style.backgroundColor = colors[i % colors.length];
        p.style.left = `${cx}px`;
        p.style.top = `${cy}px`;
        document.body.appendChild(p);

        const angle = (Math.PI * 2 * i) / 18;
        const dist = 90 + Math.random() * 150;
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist;

        p.animate([
          { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
          { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0.2)`, opacity: 0 }
        ], {
          duration: 620,
          easing: 'cubic-bezier(0.16, 1, 0.3, 1)'
        }).onfinish = () => p.remove();
      }
    }

    document.getElementById('replay-audio-btn').addEventListener('click', () => {
      initAudio();
      if (runtime.targetItem && !runtime.isPaused) {
        speakCantonese(`邊個係${runtime.targetItem.name}呀？`, 1.12);
      }
    });

    // 點擊頂部學生名牌亦可快速切換學生
    studentNameBadge.addEventListener('click', () => {
      openTeacherPanel();
    });

    // === 回合結束休息獎勵畫面 ===
    function showRoundBreak() {
      runtime.isPaused = true;
      playFanfareSound();
      const profile = getActiveProfile();
      speakCantonese('好叻喎，做得好！完成一回合啦，休息一陣先！', 1.18);

      const accuracy = profile.stats.totalCompleted > 0
        ? Math.round((profile.stats.firstTryCorrect / profile.stats.totalCompleted) * 100)
        : 100;

      const stageText = { 1: '一選一', 2: '二選一', 3: '三選一' }[profile.settings.currentChoices];

      document.getElementById('break-stats-text').innerHTML = `
        學生檔案：<strong>${profile.name}</strong><br/>
        本回合完成：<strong>${runtime.roundCompleted}</strong> 題<br/>
        目前選辦階段：<strong>${stageText}</strong><br/>
        累計首次指認準確率：<strong>${accuracy}%</strong>
      `;

      document.getElementById('break-overlay').style.display = 'flex';
    }

    document.getElementById('continue-btn').addEventListener('click', () => {
      initAudio();
      runtime.roundCompleted = 0;
      document.getElementById('break-overlay').style.display = 'none';
      runtime.isPaused = false;
      generateQuestion();
    });

    // === 教師設定面板：學生檔案切換與管理 ===
    function renderProfileTabsInPanel() {
      const container = document.getElementById('panel-profile-tabs');
      const nameInput = document.getElementById('current-student-name-input');
      const uploadLabel = document.getElementById('upload-section-label');
      const activeProfile = getActiveProfile();

      container.innerHTML = '';
      profiles.forEach(p => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'profile-tab-btn' + (p.id === activeStudentId ? ' active' : '');
        btn.textContent = `👤 ${p.name} (${p.items.length}張)`;
        btn.addEventListener('click', () => {
          if (pendingBatchItems.length > 0) {
            if (!confirm('目前還有未按「確認加入」的新相片，切換學生會清空待確認清單，確定要切換嗎？')) {
              return;
            }
            pendingBatchItems = [];
            renderPendingBatchList();
          }
          activeStudentId = p.id;
          runtime.roundCompleted = 0;
          runtime.lastTargetId = '';
          saveAllProfiles();
          applyActiveProfileSettings();
          renderProfileTabsInPanel();
          renderManageLists();
          updateStatsUI();
        });
        container.appendChild(btn);
      });

      const addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'add-profile-btn';
      addBtn.textContent = '➕ 新增學生';
      addBtn.addEventListener('click', () => promptCreateNewStudent(false));
      container.appendChild(addBtn);

      nameInput.value = activeProfile.name;
      uploadLabel.textContent = `1. 為「${activeProfile.name}」上傳相片與命名`;
    }

    document.getElementById('current-student-name-input').addEventListener('change', (e) => {
      const newName = e.target.value.trim();
      const activeProfile = getActiveProfile();
      if (newName) {
        activeProfile.name = newName;
        saveAllProfiles();
        renderProfileTabsInPanel();
        renderStartScreenProfiles();
        updateHeaderUI();
      } else {
        e.target.value = activeProfile.name;
      }
    });

    document.getElementById('delete-profile-btn').addEventListener('click', () => {
      if (profiles.length <= 1) {
        alert('至少需要保留 1 個學生檔案！如需更換資料，可按「清空此學生全部相片」或直接修改學生名稱。');
        return;
      }
      const activeProfile = getActiveProfile();
      if (confirm(`確定要刪除「${activeProfile.name}」的整個檔案及所有相片嗎？此操作無法復原。`)) {
        profiles = profiles.filter(p => p.id !== activeStudentId);
        activeStudentId = profiles[0].id;
        runtime.roundCompleted = 0;
        runtime.lastTargetId = '';
        saveAllProfiles();
        applyActiveProfileSettings();
        renderProfileTabsInPanel();
        renderStartScreenProfiles();
        renderManageLists();
        updateStatsUI();
      }
    });

    // === iPad 圖片壓縮與批量上傳處理 ===
    function compressImageFile(file, maxSize = 520) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > h) {
              if (w > maxSize) {
                h = Math.round((h * maxSize) / w);
                w = maxSize;
              }
            } else {
              if (h > maxSize) {
                w = Math.round((w * maxSize) / h);
                h = maxSize;
              }
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.82));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    const batchFileInput = document.getElementById('batch-photo-file');
    const cameraFileInput = document.getElementById('camera-photo-file');
    const pendingListEl = document.getElementById('pending-batch-list');
    const saveBatchBtn = document.getElementById('save-batch-btn');

    async function handleIncomingFiles(fileList) {
      const files = Array.from(fileList || []);
      if (files.length === 0) return;

      for (const file of files) {
        const dataUrl = await compressImageFile(file, 520);
        let baseName = file.name.replace(/\.[^/.]+$/, '');
        if (/^(IMG|DSC|PXL|Screenshot|image)_?\d*/i.test(baseName)) {
          baseName = '';
        }
        pendingBatchItems.push({
          name: baseName,
          imageUrl: dataUrl
        });
      }
      renderPendingBatchList();
    }

    batchFileInput.addEventListener('change', async (e) => {
      await handleIncomingFiles(e.target.files);
      e.target.value = '';
    });

    cameraFileInput.addEventListener('change', async (e) => {
      await handleIncomingFiles(e.target.files);
      e.target.value = '';
    });

    function renderPendingBatchList() {
      pendingListEl.innerHTML = '';
      if (pendingBatchItems.length === 0) {
        saveBatchBtn.style.display = 'none';
        return;
      }
      saveBatchBtn.style.display = 'block';

      pendingBatchItems.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'pending-row';

        const img = document.createElement('img');
        img.src = item.imageUrl;

        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = '請輸入這張相片名稱（例如：媽媽、水壺、的士）';
        input.value = item.name;
        input.maxLength = 16;
        input.addEventListener('input', (e) => {
          pendingBatchItems[idx].name = e.target.value;
        });

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.textContent = '刪除';
        delBtn.style.cssText = 'background:#FF3B30;color:#fff;border:none;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer;';
        delBtn.addEventListener('click', () => {
          pendingBatchItems.splice(idx, 1);
          renderPendingBatchList();
        });

        row.appendChild(img);
        row.appendChild(input);
        row.appendChild(delBtn);
        pendingListEl.appendChild(row);
      });

      const firstEmpty = pendingListEl.querySelector('input[value=""]');
      if (firstEmpty) firstEmpty.focus();
    }

    saveBatchBtn.addEventListener('click', () => {
      for (let i = 0; i < pendingBatchItems.length; i++) {
        if (!pendingBatchItems[i].name.trim()) {
          alert(`第 ${i + 1} 張相片還未輸入名稱，請先填寫名稱！`);
          return;
        }
      }

      const activeProfile = getActiveProfile();
      pendingBatchItems.forEach((item, idx) => {
        activeProfile.items.push({
          id: 'item_' + Date.now() + '_' + idx + '_' + Math.floor(Math.random() * 1000),
          name: item.name.trim(),
          imageUrl: item.imageUrl
        });
      });

      saveAllProfiles();
      pendingBatchItems = [];
      renderPendingBatchList();
      renderProfileTabsInPanel();
      renderStartScreenProfiles();
      renderManageLists();
    });

    // === 單題一鍵換相處理 ===
    const replaceSingleInput = document.getElementById('replace-single-input');

    replaceSingleInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file || !replacingTargetId) return;
      const dataUrl = await compressImageFile(file, 520);

      const activeProfile = getActiveProfile();
      const idx = activeProfile.items.findIndex(c => c.id === replacingTargetId);
      if (idx !== -1) {
        activeProfile.items[idx].imageUrl = dataUrl;
        saveAllProfiles();
      }

      replacingTargetId = null;
      e.target.value = '';
      renderManageLists();
    });

    // === 一鍵清空目前學生全部相片 ===
    document.getElementById('clear-all-photos-btn').addEventListener('click', () => {
      const activeProfile = getActiveProfile();
      if (activeProfile.items.length === 0) return;
      if (confirm(`確定要清空「${activeProfile.name}」的全部相片嗎？清空後可重新上傳新單元相片。`)) {
        activeProfile.items = [];
        saveAllProfiles();
        renderProfileTabsInPanel();
        renderStartScreenProfiles();
        renderManageLists();
      }
    });

    function renderManageLists() {
      const activeProfile = getActiveProfile();
      const customListEl = document.getElementById('custom-items-list');
      const emptyHintEl = document.getElementById('empty-bank-hint');
      document.getElementById('custom-count-label').textContent = activeProfile.items.length;
      customListEl.innerHTML = '';

      emptyHintEl.style.display = activeProfile.items.length === 0 ? 'block' : 'none';

      activeProfile.items.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'manage-card';
        card.innerHTML = `
          <button type="button" class="del-chip-btn" title="刪除此相片">✕</button>
          <div class="thumb-box"><img src="${item.imageUrl}" alt="${item.name}" /></div>
          <input type="text" class="rename-input" value="${item.name}" maxlength="16" title="點擊可直接修改名稱" />
          <button type="button" class="replace-photo-btn">📷 換相</button>
        `;

        card.querySelector('.del-chip-btn').addEventListener('click', () => {
          activeProfile.items.splice(idx, 1);
          saveAllProfiles();
          renderProfileTabsInPanel();
          renderStartScreenProfiles();
          renderManageLists();
        });

        card.querySelector('.rename-input').addEventListener('change', (e) => {
          const newName = e.target.value.trim();
          if (newName) {
            activeProfile.items[idx].name = newName;
            saveAllProfiles();
          } else {
            e.target.value = activeProfile.items[idx].name;
          }
        });

        card.querySelector('.replace-photo-btn').addEventListener('click', () => {
          replacingTargetId = item.id;
          replaceSingleInput.click();
        });

        customListEl.appendChild(card);
      });
    }

    // === 教師設定按鈕（單按 1 下即開啟） ===
    const trigger = document.getElementById('teacher-trigger');
    const teacherPanel = document.getElementById('teacher-panel');

    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      openTeacherPanel();
    });

    function openTeacherPanel() {
      runtime.isPaused = true;
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      applyActiveProfileSettings();
      renderProfileTabsInPanel();
      renderManageLists();
      updateStatsUI();
      teacherPanel.style.display = 'flex';
    }

    function updateStatsUI() {
      const profile = getActiveProfile();
      document.getElementById('stat-total').textContent = profile.stats.totalCompleted;
      const accuracy = profile.stats.totalCompleted > 0
        ? Math.round((profile.stats.firstTryCorrect / profile.stats.totalCompleted) * 100) + '%'
        : '--';
      document.getElementById('stat-accuracy').textContent = accuracy;
      document.getElementById('stat-stage').textContent =
        { 1: '一選一', 2: '二選一', 3: '三選一' }[profile.settings.currentChoices];
    }

    document.querySelectorAll('.btn-group').forEach(group => {
      const settingKey = group.dataset.setting;
      group.querySelectorAll('.opt-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const profile = getActiveProfile();
          const s = profile.settings;

          document.querySelectorAll(`.btn-group[data-setting="${settingKey}"] .opt-btn`).forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          let val = btn.dataset.val;
          if (settingKey === 'roundLimit') {
            val = Number(val);
            runtime.roundCompleted = 0;
          } else if (settingKey === 'showText' || settingKey === 'autoHint') {
            val = (val === 'true');
          } else if (settingKey === 'stageMode') {
            if (val !== 'auto') {
              s.currentChoices = Number(val);
            } else {
              s.currentChoices = 1;
              s.streakAtLevel = 0;
            }
          }
          s[settingKey] = val;

          if (settingKey === 'theme') {
            document.body.classList.toggle('light-theme', val === 'light');
          }
          saveAllProfiles();
          renderStartScreenProfiles();
          updateStatsUI();
        });
      });
    });

    document.getElementById('reset-stats-btn').addEventListener('click', () => {
      const profile = getActiveProfile();
      profile.stats.totalCompleted = 0;
      profile.stats.firstTryCorrect = 0;
      runtime.roundCompleted = 0;
      profile.settings.streakAtLevel = 0;
      if (profile.settings.stageMode === 'auto') profile.settings.currentChoices = 1;
      saveAllProfiles();
      updateHeaderUI();
      updateStatsUI();
    });

    document.getElementById('close-panel-btn').addEventListener('click', () => {
      const profile = getActiveProfile();
      if (pendingBatchItems.length > 0) {
        alert('你還有待確認的新相片未加入題庫，請先按綠色的「✅ 確認將以上相片全部加入此學生題庫」按鈕！');
        return;
      }
      if (profile.items.length === 0) {
        alert(`「${profile.name}」的題庫還未有相片，請先上傳至少 1 張相片並命名！`);
        return;
      }
      teacherPanel.style.display = 'none';
      document.getElementById('start-overlay').style.display = 'none';
      if (document.getElementById('break-overlay').style.display !== 'flex') {
        runtime.isPaused = false;
        generateQuestion();
      }
    });

    // === 啟動與直接開啟相片管理 ===
    document.getElementById('start-upload-btn').addEventListener('click', () => {
      initAudio();
      loadCantoneseVoice();
      document.getElementById('start-overlay').style.display = 'none';
      openTeacherPanel();
    });

    document.getElementById('start-btn').addEventListener('click', () => {
      initAudio();
      loadCantoneseVoice();
      const profile = getActiveProfile();
      document.getElementById('start-overlay').style.display = 'none';
      if (profile.items.length === 0) {
        openTeacherPanel();
      } else {
        runtime.isPaused = false;
        generateQuestion();
      }
    });

    // 初始化開始畫面學生名牌
    applyActiveProfileSettings();
    renderStartScreenProfiles();
  </script>
</body>
</html>
