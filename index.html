<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>智選小達人 - iPad 實拍相片選辦訓練</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #18181C;
      --card-border: #FFFF00;
      --text-color: #FFFF00;
      --subtext-color: #FFFFFF;
      --accent-color: #00FF00;
      --panel-bg: #161618;
      --border-color: #444444;
    }

    body.light-theme {
      --bg-color: #F4F6F9;
      --card-bg: #FFFFFF;
      --card-border: #002868;
      --text-color: #002868;
      --subtext-color: #111111;
      --accent-color: #008A00;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Microsoft JhengHei", sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* 頂部進度與重聽欄 */
    #top-bar {
      position: fixed;
      top: 14px;
      left: 84px;
      right: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
      gap: 12px;
    }

    #level-badge {
      background: var(--card-bg);
      border: 3px solid var(--card-border);
      color: var(--text-color);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 1.2rem;
      font-weight: 900;
      white-space: nowrap;
    }

    #progress-bar-container {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .progress-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 3px solid var(--card-border);
      background-color: transparent;
      transition: background-color 0.25s ease, transform 0.25s ease;
    }

    .progress-dot.filled {
      background-color: var(--card-border);
      transform: scale(1.15);
    }

    #replay-audio-btn {
      background: #FFFF00;
      color: #000000;
      border: 3px solid #000000;
      border-radius: 22px;
      padding: 10px 22px;
      font-size: 1.25rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      white-space: nowrap;
    }

    #replay-audio-btn:active {
      transform: scale(0.95);
    }

    /* 主遊戲區：題目文字 + 圖片選項容器 */
    #main-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 12px 20px 12px;
      gap: 18px;
    }

    #prompt-banner {
      font-size: clamp(2rem, 4.5vw, 3.4rem);
      font-weight: 900;
      text-align: center;
      color: var(--text-color);
      letter-spacing: 2px;
      min-height: 1.3em;
    }

    #choices-grid {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 3.5vw, 44px);
      width: 100%;
      flex: 1;
      max-height: 74vh;
    }

    /* 二選一專用：超大卡片 + 左右極致分開（貼近螢幕兩側，中間留明確分隔安全溝） */
    #choices-grid.choices-2 {
      width: 100vw;
      max-width: 100vw;
      justify-content: space-between;
      padding: 0 clamp(14px, 2vw, 28px);
      gap: clamp(48px, 10vw, 150px);
    }

    /* 圖片選擇卡片 */
    .choice-card {
      background-color: var(--card-bg);
      border: 8px solid var(--card-border);
      border-radius: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
      cursor: pointer;
      position: relative;
      transition: transform 0.22s ease, opacity 0.3s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    }

    /* 一選一：特大置中卡片 */
    .choices-1 .choice-card {
      width: min(68vw, 520px);
      height: min(64vh, 520px);
    }

    /* 二選一：維持超大視覺面積，同時推向左右兩端分開 */
    .choices-2 .choice-card {
      width: min(41vw, 500px);
      height: min(62vh, 500px);
    }

    /* 三選一：三張並排大卡片 */
    .choices-3 .choice-card {
      width: min(30vw, 390px);
      height: min(55vh, 430px);
    }

    .choice-card:active {
      transform: scale(0.96);
    }

    .choice-photo-box {
      width: 94%;
      height: 78%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 18px;
      background-color: #2A2A30;
    }

    .choice-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 18px;
      display: block;
    }

    .choice-label {
      margin-top: 12px;
      font-size: clamp(1.7rem, 3.2vw, 2.7rem);
      font-weight: 900;
      color: var(--subtext-color);
      letter-spacing: 2px;
    }

    .hide-labels .choice-label {
      display: none;
    }

    .hide-labels .choice-photo-box {
      width: 96%;
      height: 94%;
    }

    /* 答對與錯誤提示狀態 */
    .choice-card.correct-hit {
      border-color: #00FF00 !important;
      box-shadow: 0 0 40px rgba(0, 255, 0, 0.85);
      transform: scale(1.04);
      z-index: 15;
    }

    .choice-card.wrong-dimmed {
      opacity: 0.28;
      transform: scale(0.95);
      border-color: #666666;
    }

    .choice-card.hint-pulse {
      animation: hintGlow 1.1s infinite ease-in-out;
    }

    @keyframes hintGlow {
      0%, 100% {
        box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 42px rgba(0, 255, 0, 1);
        transform: scale(1.03);
        border-color: #00FF00;
      }
    }

    /* 煙花粒子 */
    .particle {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 60;
    }

    /* 教師設定按鈕（左上角單按 1 下即開啟） */
    #teacher-trigger {
      position: fixed;
      top: 14px;
      left: 14px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(80, 80, 85, 0.65);
      border: 2px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      cursor: pointer;
    }

    #teacher-trigger:active {
      transform: scale(0.94);
    }

    #teacher-trigger svg.gear-icon {
      width: 28px;
      height: 28px;
      fill: #FFFFFF;
    }

    /* 啟動與休息遮罩畫面 */
    #start-overlay, #break-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 24px;
      text-align: center;
    }

    .big-start-btn {
      background-color: #FFFF00;
      color: #000000;
      border: none;
      border-radius: 28px;
      padding: 28px 56px;
      font-size: 2.2rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 0 35px rgba(255, 255, 0, 0.6);
      margin-top: 24px;
    }

    .big-start-btn:active {
      transform: scale(0.96);
    }

    #break-overlay {
      display: none;
    }

    .trophy-icon {
      font-size: 6rem;
      margin-bottom: 10px;
    }

    .break-title {
      font-size: 2.5rem;
      font-weight: 900;
      color: #FFFF00;
      margin: 8px 0;
    }

    .break-stats {
      background: #1C1C1E;
      border: 2px solid #444;
      border-radius: 16px;
      padding: 18px 32px;
      margin: 18px 0;
      color: #FFFFFF;
      font-size: 1.25rem;
      line-height: 1.8;
    }

    /* 教師設定面板 */
    #teacher-panel {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 16px;
    }

    .panel-card {
      background-color: var(--panel-bg);
      color: #FFFFFF;
      width: 100%;
      max-width: 900px;
      max-height: 92vh;
      overflow-y: auto;
      border-radius: 20px;
      border: 2px solid var(--border-color);
      padding: 24px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 14px;
      margin-bottom: 18px;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 1.45rem;
      color: #FFFF00;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-box {
      background: #252529;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 800;
      color: #00FF00;
    }

    .stat-label {
      font-size: 0.85rem;
      color: #CCCCCC;
      margin-top: 4px;
    }

    .setting-group {
      margin-bottom: 20px;
    }

    .setting-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 1.05rem;
      color: #EFEFEF;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .opt-btn {
      background: #2C2C30;
      color: #FFFFFF;
      border: 2px solid #48484D;
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 0.94rem;
      font-weight: 600;
      cursor: pointer;
    }

    .opt-btn.active {
      background: #FFFF00;
      color: #000000;
      border-color: #FFFF00;
    }

    /* iPad 批量上傳 & 單題換相管理區 */
    .custom-upload-box {
      background: #232328;
      border: 2px dashed #55555E;
      border-radius: 14px;
      padding: 16px;
    }

    .upload-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .file-pick-btn {
      background: #00D4FF;
      color: #000000;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 1rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .camera-pick-btn {
      background: #FFB800;
      color: #000000;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 1rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* 批量待確認清單 */
    #pending-batch-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }

    .pending-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #16161A;
      border: 2px solid #FFFF00;
      border-radius: 12px;
      padding: 8px 12px;
    }

    .pending-row img {
      width: 58px;
      height: 58px;
      object-fit: cover;
      border-radius: 8px;
    }

    .pending-row input {
      background: #2A2A30;
      color: #FFFFFF;
      border: 2px solid #666;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 1rem;
      flex: 1;
      user-select: text;
      -webkit-user-select: text;
    }

    .pending-row input:focus {
      outline: none;
      border-color: #00FF00;
    }

    #save-batch-btn {
      display: none;
      margin-top: 12px;
      width: 100%;
      background: #00FF00;
      color: #000000;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
    }

    /* 已儲存相片與內置題目換相網格 */
    .items-manage-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .manage-card {
      background: #2B2B32;
      border: 1px solid #4A4A52;
      border-radius: 12px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      text-align: center;
    }

    .manage-card img {
      width: 82px;
      height: 82px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 6px;
      background: #1C1C20;
    }

    .manage-card .item-title {
      font-size: 0.96rem;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 6px;
    }

    .replace-photo-btn {
      background: #3B82F6;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .del-chip-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #FF3B30;
      color: #FFFFFF;
      border: none;
      font-weight: 900;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #custom-warning-msg {
      display: none;
      color: #FF8A8A;
      font-size: 0.88rem;
      margin-top: 8px;
    }

    .panel-footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
    }

    .action-btn {
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
    }

    .btn-reset {
      background: #3A3A3C;
      color: #FF6B6B;
    }

    .btn-close {
      background: #00FF00;
      color: #000000;
      flex: 1;
    }
  </style>
</head>
<body>

  <!-- 隱藏的單題換相 input -->
  <input type="file" id="replace-single-input" accept="image/*" style="display:none;" />

  <!-- 教師設定按鈕（左上角單按 1 下即開啟） -->
  <div id="teacher-trigger" title="開啟教師設定">
    <svg class="gear-icon" viewBox="0 0 24 24">
      <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
    </svg>
  </div>

  <!-- 頂部進度與重聽欄 -->
  <div id="top-bar">
    <div id="level-badge">階段 1：一選一</div>
    <div id="progress-bar-container"></div>
    <button id="replay-audio-btn">🔊 再聽一次</button>
  </div>

  <!-- 主遊戲畫面 -->
  <div id="main-container">
    <div id="prompt-banner">邊個係的士呀？</div>
    <div id="choices-grid" class="choices-1"></div>
  </div>

  <!-- 開始畫面 -->
  <div id="start-overlay">
    <div style="font-size: 5rem;">📸</div>
    <h1 style="font-size: 2.6rem; color: #FFFF00; margin: 12px 0;">智選小達人</h1>
    <p style="font-size: 1.2rem; color: #CCCCCC; max-width: 540px; line-height: 1.6;">
      實拍相片選辦訓練（支援 iPad 即時拍照與批量上傳相片）<br/>
      <span style="font-size: 0.95rem; color: #888;">（進入後按一下左上角齒輪即可開啟教師設定及上傳相片）</span>
    </p>
    <button class="big-start-btn" id="start-btn">開始訓練</button>
  </div>

  <!-- 回合休息獎勵畫面 -->
  <div id="break-overlay">
    <div class="trophy-icon">🏆</div>
    <div class="break-title">好叻喎！做得好！</div>
    <div class="break-stats" id="break-stats-text">
      本回合完成：9 題<br/>
      首次指認準確率：100%
    </div>
    <button class="big-start-btn" id="continue-btn">繼續下一回合</button>
  </div>

  <!-- 教師設定面板 -->
  <div id="teacher-panel">
    <div class="panel-card">
      <div class="panel-header">
        <h2>👩‍🏫 教師選辦訓練設定與 iPad 相片管理</h2>
        <span style="font-size: 0.9rem; color: #AAA;">設定即時生效</span>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-value" id="stat-total">0</div>
          <div class="stat-label">累計完成題數</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="stat-accuracy">--</div>
          <div class="stat-label">首次指認準確率</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="stat-stage">一選一</div>
          <div class="stat-label">目前訓練階段</div>
        </div>
      </div>

      <!-- 1. 選辦階段模式 -->
      <div class="setting-group">
        <label>1. 選辦難度階段（選項數量）</label>
        <div class="btn-group" data-setting="stageMode">
          <button class="opt-btn active" data-val="auto">自動進階（一選一 → 二選一 → 三選一）</button>
          <button class="opt-btn" data-val="1">固定：一選一（建立指認因果）</button>
          <button class="opt-btn" data-val="2">固定：二選一（左右兩端分開大卡片）</button>
          <button class="opt-btn" data-val="3">固定：三選一（多重視覺搜尋）</button>
        </div>
      </div>

      <!-- 2. 生活圖片主題分類 -->
      <div class="setting-group">
        <label>2. 訓練相片題庫來源與主題</label>
        <div class="btn-group" data-setting="category">
          <button class="opt-btn active" data-val="all">全部相片（內置 9 款 ＋ 老師上傳相片）</button>
          <button class="opt-btn" data-val="vehicle">香港交通工具（的士、地鐵、巴士、復康巴士）</button>
          <button class="opt-btn" data-val="daily">日常用品（牙刷、書包、輪椅、毛巾、波鞋）</button>
          <button class="opt-btn" data-val="custom">⭐ 只用老師上傳的 iPad 相片</button>
        </div>
        <div id="custom-warning-msg">⚠️ 提示：自訂相片數量不足目前選項數（建議至少上傳 3 張），系統將暫時自動補入內置相片配對。</div>
      </div>

      <!-- 3. 卡片是否顯示文字名稱 -->
      <div class="setting-group">

      <!-- 6. 每回合題數 -->

          <button class="opt-btn active" data-val="9">每 9 題暫停</button>
          <button class="opt-btn" data-val="12">每 12 題暫停</button>
          <button class="opt-btn" data-val="0">不限題數</button>

      <!-- 7. iPad 批量上傳新相片 / 即場拍照 -->
      <div class="setting-group">
        <label>7. 用 iPad 批量上傳新相片或即場拍照（永久儲存在此 iPad）</label>
        <div class="custom-upload-box">
          <div class="upload-controls">
            <label for="batch-photo-file" class="file-pick-btn">🖼️ 從 iPad 相簿批量選取多張相片</label>
            <input type="file" id="batch-photo-file" accept="image/*" multiple style="display:none;" />

            <label for="camera-photo-file" class="camera-pick-btn">📸 用 iPad 相機即場影相</label>
            <input type="file" id="camera-photo-file" accept="image/*" capture="environment" style="display:none;" />
          </div>

          <div id="pending-batch-list"></div>
          <button type="button" id="save-batch-btn">✅ 確認將以上相片全部加入題庫</button>

          <div style="margin-top: 16px; font-weight: 700; color: #FFFF00; font-size: 0.95rem;">
            已上傳的自訂相片（<span id="custom-count-label">0</span> 張）：
          </div>
          <div class="items-manage-grid" id="custom-items-list"></div>
        </div>
      </div>

      <!-- 8. 內置 9 款香港實物相片（可逐一用 iPad 換成自己影的真實相片） -->
      <div class="setting-group">
        <label>8. 內置 9 款題庫相片（按「📷 換相」可直接用 iPad 相片替換任何一題）</label>
        <div class="items-manage-grid" id="builtin-items-list"></div>
      </div>

      <div class="panel-footer">
        <button class="action-btn btn-reset" id="reset-stats-btn">重設統計數據</button>
        <button class="action-btn btn-close" id="close-panel-btn">儲存並返回訓練</button>
      </div>
    </div>
  </div>

  <script>
    // === 內置 9 款香港生活實物與交通工具題庫（採用高穩定度 Wikimedia 真實相片 + 支援一鍵替換） ===
    const DEFAULT_BUILTIN_ITEMS = [
      {
        id: 'hk_taxi',
        name: '的士',
        category: 'vehicle',
        imageUrl: 'https://upload.wikimedia.org/wikipedia/commons/thumb/3/3c/Hong_Kong_Taxi_2014.jpg/640px-Hong_Kong_Taxi_2014.jpg'
      },
      {
        id: 'hk_mtr',
        name: '地鐵',
        category: 'vehicle',
        imageUrl: 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/6d/MTR_M-Train_at_Kowloon_Bay_Station.jpg/640px-MTR_M-Train_at_Kowloon_Bay_Station.jpg'
      },
      {
        id: 'hk_bus',
        name: '巴士',
        category: 'vehicle',
        imageUrl: 'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a3/KMB_ATENU1000_UB8222.jpg/640px-KMB_ATENU1000_UB8222.jpg'
      },
      {
        id: 'hk_rehabus',
        name: '復康巴士',
        category: 'vehicle',
        imageUrl: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/45/Rehabus_HK_Toyota_Coaster.jpg/640px-Rehabus_HK_Toyota_Coaster.jpg'
      },
      {
        id: 'toothbrush',
        name: '牙刷',
        category: 'daily',
        imageUrl: 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Toothbrush_with_toothpaste.jpg/640px-Toothbrush_with_toothpaste.jpg'
      },
      {
        id: 'schoolbag',
        name: '書包',
        category: 'daily',
        imageUrl: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/41/Backpack_01.jpg/640px-Backpack_01.jpg'
      },
      {
        id: 'wheelchair',
        name: '輪椅',
        category: 'daily',
        imageUrl: 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e5/Wheelchair_manual.jpg/640px-Wheelchair_manual.jpg'
      },
      {
        id: 'towel',
        name: '毛巾',
        category: 'daily',
        imageUrl: 'https://upload.wikimedia.org/wikipedia/commons/thumb/0/0a/Towels_folded.jpg/640px-Towels_folded.jpg'
      },
      {
        id: 'sneakers',
        name: '波鞋',
        category: 'daily',
        imageUrl: 'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a6/Running_shoes_01.jpg/640px-Running_shoes_01.jpg'
      }
    ];

    // === localStorage 儲存鍵名 ===
    const CUSTOM_STORAGE_KEY = 'smart_matcher_custom_items_v2';
    const OVERRIDE_STORAGE_KEY = 'smart_matcher_builtin_overrides_v2';

    let customItems = [];
    let builtinOverrides = {}; // { hk_taxi: 'data:image/jpeg;base64,...' }
    let pendingBatchItems = []; // [{ name, imageUrl }]
    let replacingTargetId = null;

    function loadSavedPhotos() {
      try {
        const rawCustom = localStorage.getItem(CUSTOM_STORAGE_KEY);
        if (rawCustom) customItems = JSON.parse(rawCustom);
      } catch (e) { customItems = []; }

      try {
        const rawOverrides = localStorage.getItem(OVERRIDE_STORAGE_KEY);
        if (rawOverrides) builtinOverrides = JSON.parse(rawOverrides);
      } catch (e) { builtinOverrides = {}; }
    }

    function saveCustomItems() {
      try {
        localStorage.setItem(CUSTOM_STORAGE_KEY, JSON.stringify(customItems));
      } catch (e) {
        alert('iPad 瀏覽器儲存空間已滿，請先刪除部分舊相片再新增。');
      }
    }

    function saveBuiltinOverrides() {
      try {
        localStorage.setItem(OVERRIDE_STORAGE_KEY, JSON.stringify(builtinOverrides));
      } catch (e) {
        alert('iPad 瀏覽器儲存空間已滿，請先刪除部分舊相片。');
      }
    }

    function getBuiltinItems() {
      return DEFAULT_BUILTIN_ITEMS.map(item => ({
        ...item,
        imageUrl: builtinOverrides[item.id] || item.imageUrl
      }));
    }

    loadSavedPhotos();

    // 離線或網址失效時的後備文字卡片
    function makeFallbackDataUrl(label) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
        <rect width="400" height="300" fill="#2C2C32"/>
        <text x="200" y="145" font-size="44" font-weight="bold" fill="#FFFF00" text-anchor="middle" font-family="sans-serif">${label}</text>
        <text x="200" y="195" font-size="20" fill="#CCCCCC" text-anchor="middle" font-family="sans-serif">可於設定按「換相」上傳相片</text>
      </svg>`;
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

    // === 遊戲狀態 ===
    const state = {
      stageMode: 'auto',     // 'auto' | 1 | 2 | 3
      currentChoices: 1,     // 實際當前選項數 1, 2, 3
      streakAtLevel: 0,      // 自動進階用連續一次答對次數
      category: 'all',       // 'all' | 'vehicle' | 'daily' | 'custom'
      showText: true,
      theme: 'dark',
      autoHint: true,
      roundLimit: 9,

      // 統計數據
      totalCompleted: 0,
      firstTryCorrect: 0,
      roundCompleted: 0,
      isFirstTryThisQuestion: true,
      wrongAttemptsThisQuestion: 0,

      // 當前題目
      targetItem: null,
      lastTargetId: '',
      isLocked: false,
      isPaused: true
    };

    const choicesGrid = document.getElementById('choices-grid');
    const promptBanner = document.getElementById('prompt-banner');
    const levelBadge = document.getElementById('level-badge');
    const progressBarContainer = document.getElementById('progress-bar-container');

    // === Web Audio API 音效 ===
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSuccessSound() {
      if (!audioCtx) return;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const now = audioCtx.currentTime + idx * 0.06;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.45);
      });
    }

    function playGentleNudgeSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.linearRampToValueAtTime(270, now + 0.25);
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.28);
    }

    function playFanfareSound() {
      if (!audioCtx) return;
      const melody = [
        { f: 523.25, t: 0, d: 0.15 },
        { f: 659.25, t: 0.15, d: 0.15 },
        { f: 783.99, t: 0.30, d: 0.15 },
        { f: 1046.50, t: 0.48, d: 0.5 }
      ];
      melody.forEach(n => {
        const now = audioCtx.currentTime + n.t;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(n.f, now);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + n.d);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + n.d);
      });
    }

    // === 廣東話語音引擎 ===
    let cantoneseVoice = null;
    let praiseToggle = 0;

    function loadCantoneseVoice() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      cantoneseVoice =
        voices.find(v => v.lang === 'zh-HK' || v.lang === 'zh_HK') ||
        voices.find(v => v.lang.toLowerCase().includes('hk') || v.name.toLowerCase().includes('cantonese') || v.name.includes('粵語') || v.name.includes('廣東話')) ||
        null;
    }

    if ('speechSynthesis' in window) {
      loadCantoneseVoice();
      window.speechSynthesis.onvoiceschanged = loadCantoneseVoice;
    }

    function speakCantonese(text, pitch = 1.15) {
      if (!('speechSynthesis' in window) || !text) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'zh-HK';
      if (cantoneseVoice) {
        utter.voice = cantoneseVoice;
      }
      utter.rate = 0.90;
      utter.pitch = pitch;
      window.speechSynthesis.speak(utter);
    }

    // === 進度條與階段顯示 ===
    function updateHeaderUI() {
      const stageNames = { 1: '階段 1：一選一', 2: '階段 2：二選一', 3: '階段 3：三選一' };
      levelBadge.textContent = stageNames[state.currentChoices] || '一選一';

      progressBarContainer.innerHTML = '';
      if (state.roundLimit <= 0) {
        progressBarContainer.style.display = 'none';
        return;
      }
      progressBarContainer.style.display = 'flex';
      for (let i = 0; i < state.roundLimit; i++) {
        const dot = document.createElement('div');
        dot.className = 'progress-dot' + (i < state.roundCompleted ? ' filled' : '');
        progressBarContainer.appendChild(dot);
      }
    }

    // === 產生新一題 ===
    function generateQuestion() {
      if (state.isPaused) return;
      state.isLocked = false;
      state.isFirstTryThisQuestion = true;
      state.wrongAttemptsThisQuestion = 0;

      if (state.stageMode !== 'auto') {
        state.currentChoices = Number(state.stageMode);
      }
      updateHeaderUI();

      const builtinItems = getBuiltinItems();
      let targetPool = [];
      let distractorPool = [];

      if (state.category === 'custom') {
        if (customItems.length > 0) {
          targetPool = [...customItems];
          distractorPool = customItems.length >= state.currentChoices
            ? [...customItems]
            : [...customItems, ...builtinItems];
        } else {
          targetPool = [...builtinItems];
          distractorPool = [...builtinItems];
        }
      } else if (state.category === 'all') {
        targetPool = [...customItems, ...builtinItems];
        distractorPool = [...targetPool];
      } else {
        targetPool = builtinItems.filter(item => item.category === state.category);
        distractorPool = [...targetPool];
      }

      if (targetPool.length === 0) targetPool = [...builtinItems];
      if (distractorPool.length < state.currentChoices) distractorPool = [...builtinItems];

      const candidates = targetPool.length > 1
        ? targetPool.filter(item => item.id !== state.lastTargetId)
        : targetPool;
      const target = candidates[Math.floor(Math.random() * candidates.length)];
      state.targetItem = target;
      state.lastTargetId = target.id;

      const distractors = distractorPool
        .filter(item => item.id !== target.id && item.name !== target.name)
        .sort(() => Math.random() - 0.5)
        .slice(0, state.currentChoices - 1);

      const options = [target, ...distractors].sort(() => Math.random() - 0.5);

      const questionText = `邊個係${target.name}呀？`;
      promptBanner.textContent = questionText;
      speakCantonese(questionText, 1.12);

      choicesGrid.className = `choices-${state.currentChoices}` + (state.showText ? '' : ' hide-labels');
      choicesGrid.innerHTML = '';

      options.forEach(item => {
        const card = document.createElement('div');
        card.className = 'choice-card';
        card.dataset.id = item.id;

        const photoBox = document.createElement('div');
        photoBox.className = 'choice-photo-box';

        const img = document.createElement('img');
        img.className = 'choice-photo';
        img.alt = item.name;
        img.src = item.imageUrl;
        img.onerror = function() {
          this.onerror = null;
          this.src = makeFallbackDataUrl(item.name);
        };

        photoBox.appendChild(img);
        card.appendChild(photoBox);

        const labelDiv = document.createElement('div');
        labelDiv.className = 'choice-label';
        labelDiv.textContent = item.name;
        card.appendChild(labelDiv);

        card.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          handleChoiceClick(card, item);
        });

        choicesGrid.appendChild(card);
      });
    }

    // === 處理學生點擊卡片 ===
    function handleChoiceClick(cardEl, chosenItem) {
      if (state.isLocked || state.isPaused) return;
      if (cardEl.classList.contains('wrong-dimmed')) return;

      if (chosenItem.id === state.targetItem.id) {
        state.isLocked = true;
        cardEl.classList.remove('hint-pulse');
        cardEl.classList.add('correct-hit');

        document.querySelectorAll('.choice-card').forEach(c => {
          if (c !== cardEl) c.classList.add('wrong-dimmed');
        });

        const rect = cardEl.getBoundingClientRect();
        spawnCelebrationParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);
        playSuccessSound();
        if (navigator.vibrate) navigator.vibrate(70);

        state.totalCompleted += 1;
        state.roundCompleted += 1;
        if (state.isFirstTryThisQuestion) {
          state.firstTryCorrect += 1;
          state.streakAtLevel += 1;
        } else {
          state.streakAtLevel = 0;
        }

        const praises = ['好叻喎！', '做得好！'];
        const praiseWord = praises[praiseToggle % praises.length];
        praiseToggle += 1;
        speakCantonese(`${praiseWord}係${state.targetItem.name}呀！`, 1.18);

        updateHeaderUI();
        updateStatsUI();

        if (state.stageMode === 'auto' && state.streakAtLevel >= 3 && state.currentChoices < 3) {
          state.currentChoices += 1;
          state.streakAtLevel = 0;
        }

        if (state.roundLimit > 0 && state.roundCompleted >= state.roundLimit) {
          setTimeout(showRoundBreak, 1200);
        } else {
          setTimeout(generateQuestion, 1450);
        }
      } else {
        state.isFirstTryThisQuestion = false;
        state.wrongAttemptsThisQuestion += 1;
        state.streakAtLevel = 0;

        cardEl.classList.add('wrong-dimmed');
        playGentleNudgeSound();
        speakCantonese(`再試下啦，邊個係${state.targetItem.name}呀？`, 1.08);

        if (state.autoHint) {
          const correctCard = document.querySelector(`.choice-card[data-id="${state.targetItem.id}"]`);
          if (correctCard) correctCard.classList.add('hint-pulse');
        }
      }
    }

    function spawnCelebrationParticles(cx, cy) {
      const colors = ['#FFFF00', '#00FF00', '#FF3366', '#00D4FF'];
      for (let i = 0; i < 18; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = 14 + Math.random() * 14;
        p.style.width = `${size}px`;
        p.style.height = `${size}px`;
        p.style.backgroundColor = colors[i % colors.length];
        p.style.left = `${cx}px`;
        p.style.top = `${cy}px`;
        document.body.appendChild(p);

        const angle = (Math.PI * 2 * i) / 18;
        const dist = 90 + Math.random() * 150;
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist;

        p.animate([
          { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
          { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0.2)`, opacity: 0 }
        ], {
          duration: 620,
          easing: 'cubic-bezier(0.16, 1, 0.3, 1)'
        }).onfinish = () => p.remove();
      }
    }

    document.getElementById('replay-audio-btn').addEventListener('click', () => {
      initAudio();
      if (state.targetItem && !state.isPaused) {
        speakCantonese(`邊個係${state.targetItem.name}呀？`, 1.12);
      }
    });

    // === 回合結束休息獎勵畫面 ===
    function showRoundBreak() {
      state.isPaused = true;
      playFanfareSound();
      speakCantonese('好叻喎，做得好！完成一回合啦，休息一陣先！', 1.18);

      const accuracy = state.totalCompleted > 0
        ? Math.round((state.firstTryCorrect / state.totalCompleted) * 100)
        : 100;

      const stageText = { 1: '一選一', 2: '二選一', 3: '三選一' }[state.currentChoices];

      document.getElementById('break-stats-text').innerHTML = `
        本回合完成：<strong>${state.roundCompleted}</strong> 題<br/>
        目前選辦階段：<strong>${stageText}</strong><br/>
        累計首次指認準確率：<strong>${accuracy}%</strong>
      `;

      document.getElementById('break-overlay').style.display = 'flex';
    }

    document.getElementById('continue-btn').addEventListener('click', () => {
      initAudio();
      state.roundCompleted = 0;
      document.getElementById('break-overlay').style.display = 'none';
      state.isPaused = false;
      generateQuestion();
    });

    // === iPad 圖片壓縮與批量上傳處理 ===
    function compressImageFile(file, maxSize = 520) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > h) {
              if (w > maxSize) {
                h = Math.round((h * maxSize) / w);
                w = maxSize;
              }
            } else {
              if (h > maxSize) {
                w = Math.round((w * maxSize) / h);
                h = maxSize;
              }
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.82));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    const batchFileInput = document.getElementById('batch-photo-file');
    const cameraFileInput = document.getElementById('camera-photo-file');
    const pendingListEl = document.getElementById('pending-batch-list');
    const saveBatchBtn = document.getElementById('save-batch-btn');

    async function handleIncomingFiles(fileList) {
      const files = Array.from(fileList || []);
      if (files.length === 0) return;

      for (const file of files) {
        const dataUrl = await compressImageFile(file, 520);
        // 預設用去掉副檔名的檔名（若是 IMG_1234 則留空方便老師直接打廣東話名稱）
        let baseName = file.name.replace(/\.[^/.]+$/, '');
        if (/^(IMG|DSC|PXL|Screenshot|image)_?\d*/i.test(baseName)) {
          baseName = '';
        }
        pendingBatchItems.push({
          name: baseName,
          imageUrl: dataUrl
        });
      }
      renderPendingBatchList();
    }

    batchFileInput.addEventListener('change', async (e) => {
      await handleIncomingFiles(e.target.files);
      e.target.value = '';
    });

    cameraFileInput.addEventListener('change', async (e) => {
      await handleIncomingFiles(e.target.files);
      e.target.value = '';
    });

    function renderPendingBatchList() {
      pendingListEl.innerHTML = '';
      if (pendingBatchItems.length === 0) {
        saveBatchBtn.style.display = 'none';
        return;
      }
      saveBatchBtn.style.display = 'block';

      pendingBatchItems.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'pending-row';

        const img = document.createElement('img');
        img.src = item.imageUrl;

        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = '請輸入這張相片名稱（例如：的士、媽媽、水壺）';
        input.value = item.name;
        input.maxLength = 16;
        input.addEventListener('input', (e) => {
          pendingBatchItems[idx].name = e.target.value;
        });

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.textContent = '刪除';
        delBtn.style.cssText = 'background:#FF3B30;color:#fff;border:none;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer;';
        delBtn.addEventListener('click', () => {
          pendingBatchItems.splice(idx, 1);
          renderPendingBatchList();
        });

        row.appendChild(img);
        row.appendChild(input);
        row.appendChild(delBtn);
        pendingListEl.appendChild(row);
      });

      const firstEmpty = pendingListEl.querySelector('input[value=""]');
      if (firstEmpty) firstEmpty.focus();
    }

    saveBatchBtn.addEventListener('click', () => {
      for (let i = 0; i < pendingBatchItems.length; i++) {
        if (!pendingBatchItems[i].name.trim()) {
          alert(`第 ${i + 1} 張相片還未輸入名稱，請先填寫名稱！`);
          return;
        }
      }

      pendingBatchItems.forEach((item, idx) => {
        customItems.push({
          id: 'custom_' + Date.now() + '_' + idx + '_' + Math.floor(Math.random() * 1000),
          name: item.name.trim(),
          category: 'custom',
          imageUrl: item.imageUrl
        });
      });

      saveCustomItems();
      pendingBatchItems = [];
      renderPendingBatchList();
      renderManageLists();
      checkCustomWarning();
    });

    // === 單題一鍵換相處理 ===
    const replaceSingleInput = document.getElementById('replace-single-input');

    replaceSingleInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file || !replacingTargetId) return;
      const dataUrl = await compressImageFile(file, 520);

      // 檢查是內置題目還是自訂題目
      const customIdx = customItems.findIndex(c => c.id === replacingTargetId);
      if (customIdx !== -1) {
        customItems[customIdx].imageUrl = dataUrl;
        saveCustomItems();
      } else {
        builtinOverrides[replacingTargetId] = dataUrl;
        saveBuiltinOverrides();
      }

      replacingTargetId = null;
      e.target.value = '';
      renderManageLists();
    });

    function renderManageLists() {
      // 1. 渲染老師上傳的自訂相片
      const customListEl = document.getElementById('custom-items-list');
      document.getElementById('custom-count-label').textContent = customItems.length;
      customListEl.innerHTML = '';

      customItems.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'manage-card';
        card.innerHTML = `
          <button type="button" class="del-chip-btn" title="刪除此相片">✕</button>
          <img src="${item.imageUrl}" alt="${item.name}" />
          <div class="item-title">${item.name}</div>
          <button type="button" class="replace-photo-btn">📷 換相</button>
        `;
        card.querySelector('.del-chip-btn').addEventListener('click', () => {
          customItems.splice(idx, 1);
          saveCustomItems();
          renderManageLists();
          checkCustomWarning();
        });
        card.querySelector('.replace-photo-btn').addEventListener('click', () => {
          replacingTargetId = item.id;
          replaceSingleInput.click();
        });
        customListEl.appendChild(card);
      });

      // 2. 渲染內置 9 款題庫（每題都可直接按「📷 換相」換成 iPad 真實相片）
      const builtinListEl = document.getElementById('builtin-items-list');
      builtinListEl.innerHTML = '';
      getBuiltinItems().forEach(item => {
        const card = document.createElement('div');
        card.className = 'manage-card';

        const img = document.createElement('img');
        img.src = item.imageUrl;
        img.alt = item.name;
        img.onerror = function() {
          this.onerror = null;
          this.src = makeFallbackDataUrl(item.name);
        };

        const titleDiv = document.createElement('div');
        titleDiv.className = 'item-title';
        titleDiv.textContent = item.name;

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'replace-photo-btn';
        btn.textContent = '📷 iPad 換相';
        btn.addEventListener('click', () => {
          replacingTargetId = item.id;
          replaceSingleInput.click();
        });

        card.appendChild(img);
        card.appendChild(titleDiv);
        card.appendChild(btn);
        builtinListEl.appendChild(card);
      });
    }

    function checkCustomWarning() {
      const warnEl = document.getElementById('custom-warning-msg');
      warnEl.style.display = (state.category === 'custom' && customItems.length < 3)
        ? 'block'
        : 'none';
    }

    // === 教師設定按鈕（單按 1 下即開啟） ===
    const trigger = document.getElementById('teacher-trigger');
    const teacherPanel = document.getElementById('teacher-panel');

    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      openTeacherPanel();
    });

    function openTeacherPanel() {
      state.isPaused = true;
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      renderManageLists();
      checkCustomWarning();
      updateStatsUI();
      teacherPanel.style.display = 'flex';
    }

    function updateStatsUI() {
      document.getElementById('stat-total').textContent = state.totalCompleted;
      const accuracy = state.totalCompleted > 0
        ? Math.round((state.firstTryCorrect / state.totalCompleted) * 100) + '%'
        : '--';
      document.getElementById('stat-accuracy').textContent = accuracy;
      document.getElementById('stat-stage').textContent =
        { 1: '一選一', 2: '二選一', 3: '三選一' }[state.currentChoices];
    }

    document.querySelectorAll('.btn-group').forEach(group => {
      const settingKey = group.dataset.setting;
      group.querySelectorAll('.opt-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll(`.btn-group[data-setting="${settingKey}"] .opt-btn`).forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          let val = btn.dataset.val;
          if (settingKey === 'roundLimit') {
            val = Number(val);
            state.roundCompleted = 0;
          } else if (settingKey === 'showText' || settingKey === 'autoHint') {
            val = (val === 'true');
          } else if (settingKey === 'stageMode') {
            if (val !== 'auto') {
              state.currentChoices = Number(val);
            } else {
              state.currentChoices = 1;
              state.streakAtLevel = 0;
            }
          }
          state[settingKey] = val;

          if (settingKey === 'theme') {
            document.body.classList.toggle('light-theme', val === 'light');
          }
          checkCustomWarning();
          updateStatsUI();
        });
      });
    });

    document.getElementById('reset-stats-btn').addEventListener('click', () => {
      state.totalCompleted = 0;
      state.firstTryCorrect = 0;
      state.roundCompleted = 0;
      state.streakAtLevel = 0;
      if (state.stageMode === 'auto') state.currentChoices = 1;
      updateHeaderUI();
      updateStatsUI();
    });

    document.getElementById('close-panel-btn').addEventListener('click', () => {
      teacherPanel.style.display = 'none';
      if (document.getElementById('break-overlay').style.display !== 'flex') {
        state.isPaused = false;
        generateQuestion();
      }
    });

    // === 啟動遊戲 ===
    document.getElementById('start-btn').addEventListener('click', () => {
      initAudio();
      loadCantoneseVoice();
      document.getElementById('start-overlay').style.display = 'none';
      state.isPaused = false;
      generateQuestion();
    });
  </script>
</body>
</html>
